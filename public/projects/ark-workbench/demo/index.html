<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ark v2 交互演示 · 双区合体工作台</title>
<meta name="description" content="Ark v2 知识工作台的双区交互演示：左侧笔记真源、Collect 采集库、Tasks 看板与多端渠道模拟台，右侧常驻对话、历史、记忆与设置边栏。零后端，全部状态由纯函数状态机驱动。">
<link rel="icon" href="/favicon.svg">
<script>
  (function () {
    var theme = null
    try {
      theme = localStorage.getItem('ark-demo-theme')
      if (theme !== 'light' && theme !== 'dark') {
        var siteTheme = localStorage.getItem('theme')
        if (siteTheme === 'light' || siteTheme === 'dark') theme = siteTheme
      }
    } catch (_) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    }
    document.documentElement.setAttribute('data-theme', theme)
  })()
</script>
<style>
  @font-face {
    font-family: 'Satoshi';
    src: url('/fonts/Satoshi-Variable.ttf');
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('/fonts/Satoshi-VariableItalic.ttf');
    font-style: italic;
    font-display: swap;
  }

  /* ── 主题变量：对齐全站 DESIGN.md 蓝青主色与静谧表面层级，页面自带一份，不依赖任何外部样式 ── */
  :root {
    --font-ui: 'Satoshi', system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', 'Noto Sans CJK SC', sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --r-s: 6px; --r-m: 10px; --r-l: 14px;
    --ok: #3fb27f; --warn: #d9a441; --danger: #e5534b;
  }
  [data-theme="dark"] {
    --bg: #111419; --bg-2: #171b22; --bg-3: #1f252f; --bg-4: #0c0e12;
    --border: #2b3240; --border-soft: #222834;
    --text: #eef2f6; --muted: #a3adb9; --faint: #6f7a88;
    --accent: #7dd3fc; --accent-fg: #0d151c;
    --accent-soft: rgba(125,211,252,.13); --accent-border: rgba(125,211,252,.35);
    --hover: rgba(255,255,255,.05);
    --shadow: 0 1px 2px rgba(0,0,0,.38), 0 10px 30px rgba(0,0,0,.3);
    --add: #7fd1a2; --del: #ef928d;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #fcfdfe; --bg-2: #f4f7f9; --bg-3: #eaeff4; --bg-4: #e2e8ee;
    --border: #d5dde5; --border-soft: #e4eaf0;
    --text: #14181f; --muted: #4b5563; --faint: #6e7b8b;
    --accent: #3b768f; --accent-fg: #ffffff;
    --accent-soft: rgba(59,118,143,.11); --accent-border: rgba(59,118,143,.34);
    --hover: rgba(20,24,31,.045);
    --shadow: 0 1px 2px rgba(20,24,31,.05), 0 10px 28px rgba(20,24,31,.07);
    --ok: #1d8354; --warn: #a86f12; --danger: #c93b33;
    --add: #1d7a45; --del: #b0443c;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-4); color: var(--text);
    font: 14px/1.6 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  code, pre, .mono { font-family: var(--font-mono); }

  /* ── 外壳与双层顶栏 ── */
  .app { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .topbar {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    min-height: 48px; flex-wrap: wrap; border-bottom: 1px solid var(--border-soft); background: var(--bg);
  }
  .brand-cluster { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
  .brand svg { width: 19px; height: 19px; color: var(--accent); flex: none; }
  .brand small { font-weight: 500; font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
  .conn {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border-soft); background: var(--bg-2); font-size: 11.5px; color: var(--muted);
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(63,178,127,.18); flex: none; }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(217,164,65,.2); }
  .spacer { flex: 1; }
  .topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--r-s);
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    font-size: 12.5px; white-space: nowrap; text-decoration: none;
    transition: background-color .16s ease, border-color .16s ease, color .16s ease;
  }
  .btn:hover { border-color: var(--faint); background: var(--bg-3); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.06); background: var(--accent); border-color: var(--accent); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--hover); color: var(--text); border-color: var(--border-soft); }
  .btn-danger { color: var(--danger); border-color: rgba(229,83,75,.4); background: transparent; }
  .btn-danger:hover { background: rgba(229,83,75,.1); border-color: var(--danger); }
  .btn-compare {
    border-radius: 999px; padding: 3px 11px; font-size: 11.5px; font-weight: 560;
    color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft);
  }
  .btn-compare:hover {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent); filter: brightness(1.08);
  }
  .btn-xs { padding: 3px 9px; font-size: 11.5px; border-radius: var(--r-s); }
  .btn[disabled] { opacity: .42; cursor: not-allowed; }
  .btn[disabled]:hover { border-color: var(--border); background: var(--bg-2); filter: none; }
  .icon-btn {
    position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-s);
    border: 1px solid var(--border-soft); background: var(--bg-2); color: var(--muted);
    transition: background-color .16s ease, border-color .16s ease, color .16s ease;
  }
  .icon-btn:hover { background: var(--bg-3); border-color: var(--border); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }
  /* Blurred Icon Transition (DESIGN.md) */
  .theme-btn svg {
    position: absolute; inset: 0; margin: auto;
    transition: opacity .25s ease, filter .25s ease, transform .25s ease;
  }
  [data-theme="dark"] .theme-btn .icon-sun { opacity: 1; filter: blur(0); transform: scale(1); }
  [data-theme="dark"] .theme-btn .icon-moon { opacity: 0; filter: blur(4px); transform: scale(.6); }
  [data-theme="light"] .theme-btn .icon-sun { opacity: 0; filter: blur(4px); transform: scale(.6); }
  [data-theme="light"] .theme-btn .icon-moon { opacity: 1; filter: blur(0); transform: scale(1); }

  /* ── 预设体验剧本条 ── */
  .scenario-bar {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--border-soft); background: var(--bg-2);
  }
  .scenario-label {
    flex: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--faint);
    white-space: nowrap;
  }
  .scenario-grid {
    flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  }
  .scenario {
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start; min-width: 0;
    padding: 6px 11px 7px; border-radius: var(--r-s); border: 1px solid var(--border);
    background: var(--bg); text-align: left; line-height: 1.35;
    transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
  }
  .scenario-head { display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; }
  .scenario strong {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scenario-steps {
    margin-left: auto; flex: none; font: 600 10px/1.6 var(--font-mono); font-style: normal;
    padding: 0 6px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border-soft);
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .scenario-desc {
    width: 100%; font-size: 11px; color: var(--faint); letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scenario:hover { border-color: var(--accent-border); background: var(--accent-soft); }
  .scenario[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 1px var(--accent-border);
  }
  .scenario[aria-pressed="true"] .scenario-steps {
    border-color: var(--accent-border); color: var(--accent); background: var(--bg);
  }

  /* ── 平板 / 移动双区切换栏（> 960px 隐藏，<= 960px 显示） ── */
  .zone-bar {
    display: none; flex: none; gap: 6px; padding: 6px 12px;
    border-bottom: 1px solid var(--border-soft); background: var(--bg);
  }
  .zone-btn {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 10px; border-radius: var(--r-s); border: 1px solid var(--border);
    background: var(--bg-2); color: var(--muted); font-size: 12px; font-weight: 500; text-align: center;
    transition: border-color .16s ease, background-color .16s ease, color .16s ease;
  }
  .zone-btn:hover { border-color: var(--faint); color: var(--text); }
  .zone-btn[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600;
  }
  .zone-sub { font-size: 10.5px; font-weight: 400; color: var(--faint); }
  .zone-alert {
    display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 999px;
    font: 600 10px/1.6 var(--font-mono); color: var(--warn);
    border: 1px solid rgba(217,164,65,.55); background: rgba(217,164,65,.12);
  }

  .body { flex: 1; min-height: 0; display: flex; }
  .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .sidebar {
    width: min(430px, 40vw); flex: none; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--bg-2);
  }

  /* ── 标签页 ── */
  .tabs {
    flex: none; display: flex; gap: 2px; padding: 6px 10px; border-bottom: 1px solid var(--border-soft);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 0; border-radius: var(--r-s); background: transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--hover); font-weight: 600; }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: -6px; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .tab .badge-count {
    min-width: 17px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--accent-soft);
    color: var(--accent); font: 600 10.5px/16px var(--font-mono); text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .pane { flex: 1; min-height: 0; overflow-y: auto; }
  .pane[hidden] { display: none; }
  .pane-body { padding: 14px 16px 24px; }
  .ws-note-pane.pane-body { padding: 14px 18px 24px; }

  /* ── 通用排版 ── */
  p.ssub { margin: 0; font-size: 12px; color: var(--faint); line-height: 1.6; }
  .card {
    border: 1px solid var(--border-soft); border-radius: var(--r-m); background: var(--bg-2);
  }
  .kv { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .kv .spacer { flex: 1; }
  .badge {
    font: 600 10.5px/1.7 var(--font-mono); padding: 0 6px; border-radius: 4px; white-space: nowrap;
    background: var(--bg-3); color: var(--muted); border: 1px solid var(--border-soft);
  }
  .badge.agent { color: #8ab4f8; border-color: #2f4566; background: #1e2836; }
  .badge.obsidian { color: #9be2fe; border-color: #274a5d; background: #162934; }
  .badge.host { color: #7fd1a2; border-color: #2f5442; background: #1c2b24; }
  .badge.plugin { color: #e0b062; border-color: #5a4a2a; background: #2b2519; }
  .badge.undone { color: var(--faint); }
  [data-theme="light"] .badge.agent { color: #1a56c4; background: #e9f0fe; border-color: #cfe0fb; }
  [data-theme="light"] .badge.obsidian { color: #265970; background: #e6f2f7; border-color: #c5dfe9; }
  [data-theme="light"] .badge.host { color: #1d7a45; background: #e9f7ef; border-color: #cceadb; }
  [data-theme="light"] .badge.plugin { color: #8a5a12; background: #fdf4e3; border-color: #f2e2c0; }

  /* ── 笔记真源 ── */
  .note-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .note-head .path { font: 12.5px var(--font-mono); color: var(--text); }
  .source {
    border: 1px solid var(--border); border-radius: var(--r-m); overflow: hidden; background: var(--bg-2);
  }
  .source-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid var(--border-soft); font-size: 11.5px; color: var(--faint);
  }
  .source-body { padding: 10px 0; overflow-x: auto; font: 12.5px/1.75 var(--font-mono); }
  .ln { display: flex; gap: 10px; padding: 0 12px; white-space: pre; }
  .ln:hover { background: var(--hover); }
  .ln-no { width: 2.4em; flex: none; text-align: right; color: var(--faint); opacity: .6; user-select: none; font-variant-numeric: tabular-nums; }
  .ln.fm .ln-txt { color: var(--faint); }
  .ln.key .ln-txt { color: var(--accent); }
  .ln.head .ln-txt { color: var(--text); font-weight: 650; }
  .ln.li .ln-txt { color: var(--muted); }
  .ln .wikilink { color: var(--accent); border-bottom: 1px dashed var(--accent-border); }

  /* ── Collect 三栏（窄屏自适应折叠为顶部筛选条 + 上下列表详情） ── */
  .collect { display: grid; grid-template-columns: 168px minmax(0, 1.06fr) minmax(0, .94fr); height: 100%; }
  .collect-side { border-right: 1px solid var(--border-soft); padding: 12px 10px; overflow-y: auto; background: var(--bg); }
  .collect-mid { min-width: 0; display: flex; flex-direction: column; }
  .collect-detail { border-left: 1px solid var(--border-soft); padding: 14px 16px 24px; overflow-y: auto; background: var(--bg); }
  .collect-close-btn { display: none; }
  .side-group + .side-group { margin-top: 16px; }
  .side-heading {
    font: 600 10.5px/1.4 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); padding: 0 8px 6px;
  }
  .side-link {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 5px 8px; border: 1px solid transparent; border-radius: var(--r-s); background: transparent; color: var(--muted);
    font-size: 12.5px;
  }
  .side-link:hover { background: var(--hover); color: var(--text); }
  .side-link[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--text); font-weight: 550; }
  .side-link .count { margin-left: auto; font: 600 10.5px var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .side-link .glyph { width: 14px; text-align: center; color: var(--faint); flex: none; }
  .capture {
    display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .capture input {
    flex: 1; min-width: 0; height: 32px; padding: 0 9px; border-radius: var(--r-s);
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12.5px;
  }
  .capture input::placeholder { color: var(--faint); }
  .list-tools {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-s); overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 3px 9px; font-size: 11.5px;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .entry {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
    padding: 8px 9px; border: 1px solid transparent; border-radius: var(--r-s);
    background: transparent; color: var(--text);
  }
  .entry + .entry { margin-top: 2px; }
  .entry:hover { background: var(--hover); }
  .entry[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-border); }
  .entry-mark {
    flex: none; font: 600 9px/1.9 var(--font-mono); padding: 0 5px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--muted); background: var(--bg-3); margin-top: 1px;
  }
  .entry-mark.video { color: #e79bb3; border-color: #5c3244; background: #2a1e24; }
  [data-theme="light"] .entry-mark.video { color: #a5305a; border-color: #f0cdd9; background: #fdf0f4; }
  .entry-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .entry-title {
    font-size: 12.8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entry-sub { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-pill {
    flex: none; font: 600 10px/1.8 var(--font-mono); padding: 0 6px; border-radius: 999px;
    border: 1px solid var(--border);
  }
  .status-pill.done { color: var(--ok); border-color: rgba(63,178,127,.45); }
  .status-pill.processing { color: var(--warn); border-color: rgba(217,164,65,.45); }
  .status-pill.failed { color: var(--danger); border-color: rgba(229,83,75,.45); }
  .cards { display: grid; gap: 8px; padding: 10px; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
  .entry-card {
    display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 10px;
    border: 1px solid var(--border-soft); border-radius: var(--r-m); background: var(--bg-2); color: var(--text);
  }
  .entry-card:hover { border-color: var(--faint); }
  .entry-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .entry-card .card-top { display: flex; align-items: center; gap: 6px; }
  .entry-card .card-excerpt { font-size: 11.5px; color: var(--muted); min-height: 2.6em; }
  .entry-card .card-excerpt.failed { color: var(--danger); }
  .detail-source { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); flex-wrap: wrap; }
  .detail-title { margin: 8px 0 4px; font-size: 15px; line-height: 1.45; }
  .detail-url { font: 11px var(--font-mono); color: var(--accent); word-break: break-all; text-decoration: none; }
  .detail-url:hover { text-decoration: underline; }
  .detail-sec { margin-top: 14px; }
  .detail-sec h4 {
    margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
    font-weight: 650;
  }
  .detail-sec p { margin: 0; font-size: 13px; color: var(--text); }
  .detail-sec ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
  .detail-sec li + li { margin-top: 3px; }
  .error-box {
    border-left: 3px solid var(--danger); background: rgba(229,83,75,.08); padding: 9px 11px;
    border-radius: var(--r-s); font-size: 12.5px;
  }
  .error-box strong { display: block; margin-bottom: 3px; }
  .empty {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 40px 16px;
    color: var(--faint); font-size: 12.5px; text-align: center;
  }

  /* ── Tasks 看板（V7 自由多标签 · 共现分布 · 完成清单 · 周/月/年回顾工作台） ── */
  .tasks-wrap { padding: 14px 16px 26px; display: flex; flex-direction: column; gap: 12px; }
  .tasks-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .t-search { position: relative; display: inline-flex; align-items: center; }
  .t-search svg {
    position: absolute; left: 9px; width: 13px; height: 13px; color: var(--faint); pointer-events: none;
  }
  .t-search input {
    width: 178px; height: 29px; padding: 0 10px 0 27px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text); font-size: 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .t-search input::placeholder { color: var(--faint); }
  .t-search input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .tagchips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tchip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11.5px;
    transition: border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .tchip:hover { color: var(--text); border-color: var(--faint); background: var(--hover); }
  .tchip.on {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .tchip-n { font: 600 10px/1 var(--font-mono); opacity: .75; font-variant-numeric: tabular-nums; }
  .tasks-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .schip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border-soft); background: var(--bg-2); font-size: 11.5px; color: var(--muted);
  }
  .schip b { font: 700 11.5px/1.4 var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
  .schip.over { color: var(--danger); border-color: rgba(229,83,75,.42); background: rgba(229,83,75,.07); }
  .schip.over b { color: var(--danger); }
  .schip.today { color: var(--warn); border-color: rgba(217,164,65,.45); background: rgba(217,164,65,.08); }
  .schip.today b { color: var(--warn); }

  .task-quick-add {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px;
    border: 1px solid var(--accent-border); border-radius: var(--r-m); background: var(--bg-2);
  }
  .task-quick-add input[type="text"] {
    flex: 1 1 220px; min-width: 180px; height: 30px; padding: 0 10px; border-radius: var(--r-s);
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12.5px;
  }
  .task-quick-lbl { font-size: 11px; color: var(--faint); }

  .tasks-focus {
    border: 1px solid var(--border-soft); border-left: 3px solid var(--danger); border-radius: var(--r-m);
    background: var(--bg-2); padding: 7px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .tasks-focus.only-today { border-left-color: var(--warn); }
  .fitem { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12.5px; flex-wrap: wrap; }
  .fitem-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .fitem.over .fitem-dot { background: var(--danger); }
  .fitem.today .fitem-dot { background: var(--warn); }
  .fitem-main { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fitem-main b { font-weight: 600; color: var(--text); }
  .fitem-when { font: 600 11px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; }
  .fitem.over .fitem-when { color: var(--danger); }
  .fitem.today .fitem-when { color: var(--warn); }

  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .col {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--r-l);
    padding: 10px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .col-head {
    display: flex; align-items: center; gap: 7px; padding: 0 2px 8px;
    border-bottom: 1px solid var(--border-soft); font-size: 12.5px; font-weight: 650; color: var(--text);
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .col[data-state="doing"] .col-dot { background: var(--accent); }
  .col[data-state="done"] .col-dot { background: var(--ok); }
  .col-head .n {
    margin-left: auto; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); font: 600 10.5px/19px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .col-slot { display: flex; flex-direction: column; gap: 7px; }
  .task {
    border: 1px solid var(--border); border-radius: var(--r-m); background: var(--bg);
    padding: 10px 11px; display: flex; flex-direction: column; gap: 6px;
  }
  .task.done { opacity: .82; }
  .task-title { font-size: 12.8px; font-weight: 600; line-height: 1.45; color: var(--text); }
  .task.done .task-title { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .task-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .ttag {
    font-size: 11px; line-height: 1.5; border-radius: 999px; padding: 0 7px;
    border: 1px solid var(--accent-border); color: var(--accent); background: var(--accent-soft);
  }
  button.ttag { cursor: pointer; }
  button.ttag:hover { border-color: var(--accent); filter: brightness(1.08); }
  .task-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .tpill {
    font-size: 10.5px; line-height: 1.6; border-radius: 999px; padding: 0 7px;
    border: 1px solid var(--border); color: var(--muted); background: var(--bg-2);
  }
  .tpill.due-over { color: var(--danger); border-color: rgba(229,83,75,.5); background: rgba(229,83,75,.1); font-weight: 600; }
  .tpill.due-today { color: var(--warn); border-color: rgba(217,164,65,.5); background: rgba(217,164,65,.1); font-weight: 600; }
  .tpill.due-done { color: var(--ok); border-color: rgba(63,178,127,.4); background: rgba(63,178,127,.08); }
  .tpill.parent { color: var(--accent); border-color: var(--accent-border); background: transparent; }
  .tpill.tid { font-family: var(--font-mono); color: var(--faint); border-style: dashed; margin-left: auto; background: transparent; }
  .task-desc {
    color: var(--muted); font-size: 11.8px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding-top: 2px; }
  .task-move { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .col-empty {
    border: 1px dashed var(--border); border-radius: var(--r-s); color: var(--faint);
    text-align: center; padding: 16px 8px; font-size: 12px;
  }
  .more-done {
    border: 0; background: transparent; color: var(--accent); font-size: 11.5px;
    padding: 4px 2px 0; text-align: left;
  }
  .more-done:hover { text-decoration: underline; }

  .ctx-preview {
    border: 1px dashed var(--border); border-radius: var(--r-m); padding: 10px 12px; background: var(--bg-2);
  }
  .ctx-preview h4 {
    margin: 0 0 5px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  }
  .ctx-preview pre { margin: 0; font: 11.5px/1.65 var(--font-mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; }

  /* ── Tasks 回顾与洞察工作台（周 / 月 / 年） ── */
  .wb {
    margin-top: 4px; border-top: 1px solid var(--border-soft); padding-top: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .wb-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wb-toggle {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px; border: 0;
    border-radius: var(--r-s); background: transparent; font-size: 13.5px; color: var(--text);
  }
  .wb-toggle:hover { background: var(--hover); }
  .wb-caret { color: var(--muted); font-size: 12px; width: 12px; text-align: center; }
  .wb-tabs {
    display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--border-soft);
  }
  .wtab {
    border: 0; background: transparent; color: var(--muted); border-radius: 999px;
    padding: 2px 13px; font-size: 12px; transition: background-color .15s ease, color .15s ease;
  }
  .wtab:hover { color: var(--text); }
  .wtab.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .wb-head-note { margin-left: auto; font-size: 11px; color: var(--faint); }
  .wb-filter {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 11px;
    border-radius: var(--r-m); border: 1px solid var(--border-soft); background: var(--bg-2);
  }
  .wb-lbl { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .wb-filter-note { font-size: 11.5px; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
  .wb-genbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wb-gen-hint { font-size: 11px; color: var(--faint); }
  .wb-reviews {
    display: flex; flex-direction: column; gap: 6px; padding: 8px 11px;
    border-radius: var(--r-m); border: 1px solid var(--accent-border); background: var(--accent-soft);
  }
  .wb-rev-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; }
  .wb-rev-pre {
    margin: 4px 0 0; padding: 8px 10px; border-radius: var(--r-s); background: var(--bg);
    border: 1px solid var(--border-soft); font: 11px/1.6 var(--font-mono); color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
  }

  .wb-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .wb-stat {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--r-m);
    padding: 8px 11px;
  }
  .wb-stat .s-num { font: 700 18px/1.3 var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
  .wb-stat .s-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .wb-stat.done .s-num { color: var(--ok); }
  .wb-stat.over .s-num { color: var(--danger); }
  .wb-stat.rate .s-num { color: var(--accent); }

  .wb-sec-title {
    margin: 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .wb-sec-sub { font-size: 11px; font-weight: 400; color: var(--faint); }
  .wb-box {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--r-l); padding: 11px 12px;
  }

  /* 周视图 */
  .wb-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day-col {
    background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--r-s);
    min-height: 104px; padding: 7px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .day-col.today-col { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .day-h { font: 600 10.5px/1.4 var(--font-mono); color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .day-col.today-col .day-h { color: var(--accent); }
  .wchip {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-left: 2.5px solid var(--accent);
    border-radius: 4px; padding: 2px 5px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wchip.done { border-left-color: var(--ok); color: var(--faint); text-decoration: line-through; }

  /* 月视图 */
  .cal-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cal-mon { font-weight: 650; font-size: 13px; min-width: 88px; text-align: center; }
  .cal-line { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .wb-mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mhead { text-align: center; font-size: 11px; color: var(--faint); padding-bottom: 2px; }
  .mcell {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--r-s);
    min-height: 62px; padding: 4px 5px; font-size: 10.5px; min-width: 0; display: flex; flex-direction: column; gap: 2px;
  }
  .mcell.dim { opacity: .36; background: var(--bg); }
  .mcell.today-cell { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .mcell-d {
    display: flex; align-items: center; justify-content: space-between;
    font: 600 10.5px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .mcell-ok { color: var(--ok); font-weight: 700; }
  .mchip {
    border-radius: 3px; padding: 0 4px; background: var(--bg); border-left: 2px solid var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
  }
  .mchip.done { border-left-color: var(--ok); color: var(--ok); background: transparent; }

  /* 年视图：12 月热力 + 共现条形图 + 完成清单 */
  .wb-ygrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
  .ycell {
    border: 1px solid var(--border-soft); border-radius: var(--r-s); padding: 8px 10px;
    background: var(--bg); text-align: left; display: flex; flex-direction: column; gap: 3px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .ycell:hover { border-color: var(--accent); }
  .ycell-m { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--text); }
  .ycell-sub { font: 500 10.5px var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .ycell-cnt { font: 700 16px/1.25 var(--font-mono); color: var(--ok); font-variant-numeric: tabular-nums; }
  .ycell.lv0 { background: var(--bg-2); }
  .ycell.lv0 .ycell-cnt { color: var(--faint); font-weight: 500; }
  .ycell.lv1 { background: rgba(63,178,127,.11); border-color: rgba(63,178,127,.28); }
  .ycell.lv2 { background: rgba(63,178,127,.24); border-color: rgba(63,178,127,.45); }
  [data-theme="light"] .ycell.lv1 { background: rgba(29,131,84,.09); border-color: rgba(29,131,84,.26); }
  [data-theme="light"] .ycell.lv2 { background: rgba(29,131,84,.2); border-color: rgba(29,131,84,.42); }

  .wb-flow { display: flex; flex-direction: column; gap: 7px; }
  .wb-frow {
    display: grid; grid-template-columns: 78px minmax(0, 1fr) 46px; align-items: center; gap: 10px;
    border: 0; background: transparent; padding: 2px 0; text-align: left; width: 100%;
  }
  .wb-fname { font-size: 12px; color: var(--text); text-align: right; font-weight: 550; }
  .wb-frow:hover .wb-fname { color: var(--accent); text-decoration: underline; }
  .wb-ftrack {
    height: 16px; background: var(--bg); border: 1px solid var(--border-soft);
    border-radius: 999px; overflow: hidden; display: block;
  }
  .wb-ffill {
    height: 100%; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
    display: flex; align-items: center; justify-content: flex-end; padding: 0 7px;
    font: 700 10.5px/1 var(--font-mono); min-width: 24px; font-variant-numeric: tabular-nums;
  }
  .wb-fpct { font: 600 11.5px var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .wb-dlist {
    background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--r-l); overflow: hidden;
  }
  .wb-ditem {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--border-soft); font-size: 12.3px; flex-wrap: wrap;
  }
  .wb-ditem:last-child { border-bottom: 0; }
  .wb-dmain { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wb-dmain b { font-weight: 560; color: var(--text); }
  .wb-dwhen { font: 600 11px var(--font-mono); color: var(--ok); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── 渠道模拟台 ── */
  .channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 10px; padding: 12px; }
  .channel {
    display: flex; flex-direction: column; gap: 8px; padding: 12px;
    border: 1px solid var(--border-soft); border-radius: var(--r-m); background: var(--bg-2);
  }
  .channel-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .channel-name { font-size: 13.5px; font-weight: 600; }
  .grade {
    margin-left: auto; font: 600 9.5px/1.8 var(--font-mono); padding: 0 6px; border-radius: 4px; white-space: nowrap;
  }
  .grade.verified { color: var(--ok); border: 1px solid rgba(63,178,127,.45); background: rgba(63,178,127,.09); }
  .grade.mcp { color: var(--warn); border: 1px solid rgba(217,164,65,.5); background: rgba(217,164,65,.1); }
  .channel-detail { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: 0; }
  .channel-actions { display: flex; flex-wrap: wrap; gap: 5px; }
  .channel-state {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--faint);
    border-top: 1px solid var(--border-soft); padding-top: 7px;
  }
  .thread-card { margin: 0 12px 12px; padding: 12px; }
  .thread-card h4 { margin: 0 0 8px; font-size: 12px; font-weight: 650; }
  .conflict {
    display: flex; flex-direction: column; gap: 3px; margin-top: 8px; padding: 8px 10px;
    border-left: 3px solid var(--warn); background: rgba(217,164,65,.08); border-radius: var(--r-s);
    font-size: 12px;
  }
  .conflict .cf-head { display: flex; align-items: center; gap: 6px; font: 600 11px var(--font-mono); color: var(--warn); }

  /* ── 右侧边栏：对话 ── */
  .ctx-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px dashed var(--border-soft); font-size: 11.5px; color: var(--faint);
  }
  .ctx-note {
    display: inline-flex; align-items: center; gap: 5px; max-width: 180px; padding: 3px 8px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--text); font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-actions { display: flex; gap: 2px; margin-left: auto; }
  .messages { padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; gap: 5px; }
  .msg-user { align-items: flex-end; }
  .msg-user .bubble {
    max-width: 86%; padding: 7px 12px; border-radius: 12px 12px 4px 12px;
    background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 13px;
  }
  .msg-agent .bubble { border-left: 2px solid var(--border); padding: 1px 0 1px 11px; font-size: 13px; }
  .msg-system .bubble {
    border-left: 2px solid var(--warn); padding: 4px 0 4px 11px; font-size: 12px; color: var(--muted);
    font-family: var(--font-mono);
  }
  .msg-meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .msg-user .msg-meta { justify-content: flex-end; }
  .trace { border: 1px solid var(--border-soft); border-radius: var(--r-m); background: var(--bg-3); }
  .trace > summary {
    display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer;
    font-size: 11.5px; color: var(--muted); list-style: none;
  }
  .trace > summary::-webkit-details-marker { display: none; }
  .trace > summary::before {
    content: "\25B8"; color: var(--faint); font-size: 10px; transition: transform .15s;
  }
  .trace[open] > summary::before { transform: rotate(90deg); }
  .trace-stats { margin-left: auto; font: 10.5px var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .trace-body { padding: 0 10px 9px; }
  .steps { list-style: none; margin: 0; padding: 2px 0 0 6px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .step { position: relative; padding-left: 12px; }
  .step::before {
    content: ""; position: absolute; left: -4.5px; top: 6px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--bg-3); border: 1.5px solid var(--accent);
  }
  .step-head { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; flex-wrap: wrap; }
  .step-tool { font-weight: 600; font-family: var(--font-mono); font-size: 11px; }
  .step-arg { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

/**
 * Ark v2 interactive workbench — the one implementation of the state machine.
 *
 * This file is plain JavaScript on purpose: the demo page at
 * `public/projects/ark-workbench/demo/index.html` inlines it verbatim (it is a
 * static asset and cannot import a module at runtime), and
 * `src/lib/demo/ark/mirror.test.ts` fails if the two copies ever differ by a
 * single byte. `src/lib/demo/ark/state.ts` adds the TypeScript types on top.
 *
 * Design rules encoded here (Ark `docs/design.md` v0.8):
 *
 * 1. Anything Git can undo is written without a dialog. Vault writes (organise a
 *    note, Collect intake, task board edits, manual task review generation) apply
 *    immediately and append exactly one snapshot carrying its source tag.
 *    `undoSnapshot` puts the exact previous bytes back and marks that snapshot
 *    reverted; the history list itself is never rewritten.
 * 2. External, irreversible writes stop at a confirmation. Mail via Tencent
 *    AgentMail always becomes a `pendingAction` with `status: 'pending'`; only an
 *    explicit approve sends it, and a reject backfills the refusal with no
 *    external effect.
 * 3. Inferred memory never enters the 2k resident layer and always renders with
 *    `[推测，未确认]`. Confirming records the `via` channel; downgrading by
 *    channel bulk-reverts only that host's confirmed entries.
 * 4. A cross-host Live State save checks `baseRev === thread.rev`. A stale
 *    `baseRev` never overwrites: it lands in `thread.pendingConflicts`.
 *
 * Everything is pure and deterministic (no Date.now, no Math.random — a
 * monotonic `clock` plus fixed `ARK_TASKS_NOW` anchor), so a scenario replays to
 * an identical state across any timezone.
 */

/* ── deterministic helpers ─────────────────────────────────────────────── */

function fnv1a(input) {
  let hash = 0x811c9dc5
  for (let i = 0; i < input.length; i += 1) {
    hash ^= input.charCodeAt(i)
    hash = Math.imul(hash, 0x01000193) >>> 0
  }
  return hash.toString(16).padStart(8, '0')
}

/** `rev` is a content hash, exactly like Ark's Live State rev. */
function revOf(content) {
  return `rev-${fnv1a(content)}`
}

/** CJK counts 1 token per character, everything else 1 token per 4 characters. */
export function estimatedTokens(text) {
  let tokens = 0
  for (const char of text) tokens += /[\u3000-\u9fff\uff00-\uffef]/.test(char) ? 1 : 0.25
  return Math.ceil(tokens)
}

export function messageTime(at) {
  const minutes = 9 * 60 + at * 3
  const hh = String(Math.floor(minutes / 60) % 24).padStart(2, '0')
  const mm = String(minutes % 60).padStart(2, '0')
  return `${hh}:${mm}`
}

/** A line diff good enough to colour: unchanged lines kept as context. */
export function diffLines(before, after) {
  const left = before ? before.split('\n') : []
  const right = after ? after.split('\n') : []
  const out = []
  const rows = Math.max(left.length, right.length)
  for (let i = 0; i < rows; i += 1) {
    const a = left[i]
    const b = right[i]
    if (a === b) {
      if (a !== undefined) out.push(` ${a}`)
      continue
    }
    if (a !== undefined) out.push(`- ${a}`)
    if (b !== undefined) out.push(`+ ${b}`)
  }
  return out.join('\n')
}

function cloneTask(task) {
  return { ...task, tags: [...task.tags] }
}

function cloneTasks(tasks) {
  return tasks.map(cloneTask)
}

function cloneReview(review) {
  return { ...review }
}

function taskLines(tasks) {
  const mark = { todo: '[ ]', doing: '[-]', done: '[x]' }
  return tasks
    .map(
      (task) => `${mark[task.status] || '[ ]'} ${task.id} ${task.title} [${task.tags.join(', ')}]`
    )
    .join('\n')
}

function collectLines(items) {
  return items.map((item) => `${item.status} ${item.category || '未分类'} ${item.title}`).join('\n')
}

function commitId(clock, kind) {
  return fnv1a(`${kind}:${clock}:${kind}`)
}

/* ── V7 Tasks pure domain helpers ──────────────────────────────────────── */

export function isTaskOverdue(task, nowIso = ARK_TASKS_NOW) {
  return Boolean(task.due && task.status !== 'done' && task.due < nowIso)
}

export function isTaskDueToday(task, nowIso = ARK_TASKS_NOW) {
  if (task.status === 'done') return false
  return Boolean(task.dueToday || (task.due && task.due.slice(0, 10) === nowIso.slice(0, 10)))
}

export function isSameTaskWeek(iso) {
  if (!iso) return false
  const day = iso.slice(0, 10)
  return day >= ARK_TASKS_WEEK_DATES[0] && day <= ARK_TASKS_WEEK_DATES[6]
}

/** Frequency-sorted tag list across all tasks on the board. */
export function taskTagCounts(tasks) {
  const counts = new Map()
  for (const task of tasks) {
    for (const tag of task.tags) {
      counts.set(tag, (counts.get(tag) || 0) + 1)
    }
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([tag, count]) => ({ tag, count }))
}

export function taskMatchesFilter(task, filter = {}) {
  const tag = filter.tag || 'all'
  const q = (filter.query || '').trim().toLowerCase()
  if (tag !== 'all' && !task.tags.includes(tag)) return false
  if (!q) return true
  const haystack = [task.title, task.desc || '', task.parent || '', task.id, ...task.tags]
    .join(' ')
    .toLowerCase()
  return haystack.includes(q)
}

/**
 * V7 tag distribution & co-occurrence breakdown over completed tasks in 2026:
 * - `tag === 'all'`: overall tag frequency across completed tasks.
 * - `tag !== 'all'`: co-occurring tags on completed tasks carrying `tag`.
 */
export function taskCooccurrence(tasks, filter = {}) {
  const tag = filter.tag || 'all'
  const yearDone = tasks.filter(
    (task) =>
      taskMatchesFilter(task, filter) &&
      task.status === 'done' &&
      task.completed &&
      task.completed.slice(0, 4) === '2026'
  )
  const counts = new Map()
  for (const task of yearDone) {
    for (const itemTag of task.tags) {
      if (tag !== 'all' && itemTag === tag) continue
      counts.set(itemTag, (counts.get(itemTag) || 0) + 1)
    }
  }
  const rows = [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([rowTag, count]) => ({
      tag: rowTag,
      count,
      pct: yearDone.length ? Math.round((count / yearDone.length) * 100) : 0
    }))
  return {
    mode: tag === 'all' ? 'distribution' : 'cooccurrence',
    pivotTag: tag === 'all' ? null : tag,
    totalDone: yearDone.length,
    rows
  }
}

export function taskYearSummary(tasks, filter = {}) {
  const visible = tasks.filter((task) => taskMatchesFilter(task, filter))
  const yearDone = visible
    .filter(
      (task) => task.status === 'done' && task.completed && task.completed.slice(0, 4) === '2026'
    )
    .sort((a, b) => (b.completed < a.completed ? -1 : 1))
  const open = visible.filter((task) => task.status !== 'done')
  const overdueCount = open.filter((task) => isTaskOverdue(task)).length
  const byMonth = Array.from({ length: 12 }, () => 0)
  for (const task of yearDone) {
    const monthIndex = Number(task.completed.slice(5, 7)) - 1
    if (monthIndex >= 0 && monthIndex < 12) byMonth[monthIndex] += 1
  }
  const totalTracked = yearDone.length + open.length
  const completionRate = totalTracked ? Math.round((yearDone.length / totalTracked) * 100) : 0
  return {
    totalTracked,
    yearDone,
    overdueCount,
    completionRate,
    byMonth,
    flow: taskCooccurrence(tasks, filter)
  }
}

export function memoryDisplay(memory) {
  return memory.status === 'inferred' ? `${MEMORY_INFERRED_PREFIX}${memory.text}` : memory.text
}

/**
 * The 2k resident layer: confirmed preferences + the Live State summary + the
 * enabled plugin's `context.md`. Inferred entries are structurally excluded —
 * not filtered out by a budget check that might later pass.
 */
export function residentPreview(state) {
  const confirmed = state.memories.filter((memory) => memory.status === 'confirmed')
  const parts = [
    { label: '已确认偏好', tokens: confirmed.reduce((sum, m) => sum + estimatedTokens(m.text), 0) },
    { label: 'Live State 摘要', tokens: estimatedTokens(state.thread.summary) },
    { label: '插件 context.md（今日到期）', tokens: estimatedTokens(taskContextPreview(state)) }
  ]
  return {
    ids: confirmed.map((memory) => memory.id),
    tokens: parts.reduce((sum, part) => sum + part.tokens, 0),
    limit: ARK_BUDGET.resident,
    parts
  }
}

/** What the tasks plugin injects: only unfinished work that is due today. */
export function taskContextPreview(state) {
  const due = state.tasks.filter((task) => isTaskDueToday(task))
  const lines = due.length
    ? due.map(
        (task) =>
          `- [ ] ${task.title}（${task.id} · 今日到期 · ${task.status} · ${task.tags.map((g) => `#${g}`).join(' ')}）`
      )
    : ['- 今天没有未完成且到期的任务']
  return [`# context.md · ${state.thread.slug}`, '## 今日到期', ...lines].join('\n')
}

/** Category counts for the Collect sidebar. */
export function collectCategories(state) {
  const counts = new Map()
  for (const item of state.collectItems) {
    const key = item.category || '未分类'
    counts.set(key, (counts.get(key) || 0) + 1)
  }
  return [...counts.entries()].map(([name, count]) => ({ name, count }))
}

export function channelOf(host) {
  return ARK_CHANNELS.find((channel) => channel.host === host)
}

/* ── reducer internals ─────────────────────────────────────────────────── */

function withSnapshot(state, input, patch) {
  const clock = state.clock + 1
  const snapshot = {
    commit: commitId(clock, input.kind),
    kind: input.kind,
    source: input.source,
    message: input.message,
    diff: input.diff,
    reverted: false,
    at: clock,
    previousNoteContent: input.previousNoteContent,
    previousNoteRev: input.previousNoteRev,
    previousTasks: input.previousTasks,
    previousTaskReviews: input.previousTaskReviews,
    reviewPath: input.reviewPath,
    previousCollectItems: input.previousCollectItems
  }
  return { ...state, ...patch, clock, snapshots: [...state.snapshots, snapshot] }
}

function say(state, role, text, trace) {
  const clock = state.clock + 1
  return {
    ...state,
    clock,
    chat: [...state.chat, { id: `msg-${clock}`, role, text, at: clock, trace }]
  }
}

function sourceOfCollect(item) {
  return item.sourceHost === 'astrbot-qq' ? 'ark(astrbot)' : 'plugin:collect'
}

function collectSummary(item) {
  return item.kind === 'video'
    ? `这条视频把「${item.category || '未分类'}」的实操拆成三步，重点在把捕获成本压到一次粘贴。`
    : `这篇文章从「${item.category || '未分类'}」角度给出可操作的清单，结论先于论据。`
}

function collectPoints(item) {
  return item.kind === 'video'
    ? [
        '先把入口做窄，只留一个粘贴框。',
        '入库必须带来源锚点，否则三个月后没人敢引用。',
        '摘要只写能行动的部分。'
      ]
    : [
        '先判断这条资料服务于哪个工作流。',
        '把结论和引用证据分开记。',
        '失败时要保留原链接，不能编摘要。'
      ]
}

/** Undo one snapshot by commit. Only the newest un-reverted snapshot can go. */
export function undoSnapshot(state, commit) {
  const newest = [...state.snapshots].reverse().find((snapshot) => !snapshot.reverted)
  if (!newest || newest.commit !== commit) return state

  const snapshots = state.snapshots.map((snapshot) =>
    snapshot.commit === commit ? { ...snapshot, reverted: true } : snapshot
  )

  if (newest.kind === 'note' && newest.previousNoteContent !== undefined) {
    const note = {
      ...state.note,
      content: newest.previousNoteContent,
      rev: newest.previousNoteRev || revOf(newest.previousNoteContent)
    }
    return say(
      { ...state, snapshots, note },
      'agent',
      `已撤销 ${commit}，笔记精确恢复到写入前的字节。`
    )
  }

  if (newest.kind === 'tasks') {
    const nextState = {
      ...state,
      snapshots,
      tasks: newest.previousTasks ? cloneTasks(newest.previousTasks) : state.tasks,
      taskReviews: newest.previousTaskReviews
        ? newest.previousTaskReviews.map(cloneReview)
        : state.taskReviews
    }
    const text = newest.previousTaskReviews
      ? `已撤销 ${commit}，回顾记录 ${newest.reviewPath || 'reviews/'} 已从 Vault 撤回。`
      : `已撤销 ${commit}，任务看板回到写入前的状态。`
    return say(nextState, 'agent', text)
  }

  if (newest.kind === 'collect' && newest.previousCollectItems) {
    return say(
      {
        ...state,
        snapshots,
        collectItems: newest.previousCollectItems.map((item) => ({ ...item, tags: [...item.tags] }))
      },
      'agent',
      `已撤销 ${commit}，入库记录与摘要笔记一并撤回，来源链接保留。`
    )
  }

  return { ...state, snapshots }
}

/* ── dispatch ──────────────────────────────────────────────────────────── */

export function dispatch(state, action) {
  switch (action.type) {
    case 'set-workspace-tab':
      return state.workspaceTab === action.tab ? state : { ...state, workspaceTab: action.tab }

    case 'set-sidebar-tab':
      return state.sidebarTab === action.tab ? state : { ...state, sidebarTab: action.tab }

    case 'organize-note': {
      if (state.note.content === NOTE_ORGANISED) return state
      return say(
        withSnapshot(
          state,
          {
            kind: 'note',
            source: 'ark(ark-agent)',
            message: `ark(ark-agent): organize ${state.note.path}`,
            diff: diffLines(state.note.content, NOTE_ORGANISED),
            previousNoteContent: state.note.content,
            previousNoteRev: state.note.rev
          },
          {
            workspaceTab: 'note',
            note: { ...state.note, content: NOTE_ORGANISED, rev: revOf(NOTE_ORGANISED) }
          }
        ),
        'agent',
        '整理完成：frontmatter 补了工作流标签，末尾加了一条双链。没有弹确认框 —— 这件事 Git 撤得回来。'
      )
    }

    case 'undo-latest': {
      const newest = [...state.snapshots].reverse().find((snapshot) => !snapshot.reverted)
      return newest ? undoSnapshot(state, newest.commit) : state
    }

    case 'undo-snapshot':
      return undoSnapshot(state, action.commit)

    case 'collect-submit': {
      const url = action.url.trim()
      if (!url) return state
      const isVideo = /bilibili\.com/i.test(url)
      const id = `c${state.collectItems.length + 1}`
      const item = {
        id,
        kind: isVideo ? 'video' : 'web',
        title: isVideo
          ? '新采集的 B 站视频（等待抽取）'
          : `新采集的网页（${url.replace(/^https?:\/\//, '').slice(0, 28)}）`,
        url,
        origin: url.replace(/^https?:\/\//, '').split('/')[0] || url,
        sourceHost: action.host,
        status: 'processing',
        category: '',
        tags: ['待处理'],
        addedAt: '刚刚',
        progress: '链接已进 queue，采集扩展正在取素材。'
      }
      return say(
        { ...state, workspaceTab: 'collect', collectItems: [...state.collectItems, item] },
        'user',
        action.host === 'astrbot-qq'
          ? `手机 QQ（AstrBot）投递了一个链接：${url}`
          : `投递了一个链接：${url}`
      )
    }

    case 'collect-finish': {
      const target = state.collectItems.find((item) => item.id === action.id)
      if (!target || target.status === 'done') return state
      const finished = {
        ...target,
        status: 'done',
        summary: collectSummary(target),
        points: collectPoints(target),
        progress: undefined,
        error: undefined,
        notePath: `笔记/collect/${target.id}-${target.kind === 'video' ? '视频摘要' : '文章摘要'}.md`
      }
      const items = state.collectItems.map((item) => (item.id === action.id ? finished : item))
      return say(
        withSnapshot(
          state,
          {
            kind: 'collect',
            source: sourceOfCollect(target),
            message: `${sourceOfCollect(target)}: collect ${finished.notePath}`,
            diff: diffLines(collectLines(state.collectItems), collectLines(items)),
            previousCollectItems: state.collectItems.map((item) => ({
              ...item,
              tags: [...item.tags]
            }))
          },
          { collectItems: items }
        ),
        'agent',
        `入库完成：${finished.notePath}。摘要、要点、来源锚点都在，随时可检索。`,
        [
          { tool: 'collect_fetch', arg: finished.origin, result: '取到正文与元数据', ms: 640 },
          {
            tool: 'collect_extract',
            arg: '摘要 + 要点',
            result: '生成 1 段摘要、3 条要点',
            ms: 1180
          },
          { tool: 'write', arg: finished.notePath, result: '写入 Vault，附带来源锚点', ms: 14 }
        ]
      )
    }

    case 'collect-retry': {
      const target = state.collectItems.find((item) => item.id === action.id)
      if (!target || target.status === 'processing') return state
      const items = state.collectItems.map((item) =>
        item.id === action.id
          ? {
              ...item,
              status: 'processing',
              error: undefined,
              progress: '重试任务已入队，等待采集扩展。'
            }
          : item
      )
      return say(
        { ...state, collectItems: items },
        'agent',
        `已重试 ${action.id}：任务入队，没有生成任何摘要。`
      )
    }

    case 'create-task': {
      const title = (action.title || '').trim()
      if (!title) return state
      const rawTags = Array.isArray(action.tags) ? action.tags : []
      const cleanTags = [...new Set(rawTags.map((tag) => String(tag).trim()).filter(Boolean))]
      const tags = cleanTags.length ? cleanTags : ['工作']
      const due = action.dueToday ? '2026-11-21T20:00:00+08:00' : action.due || null
      const hashId = `t-${fnv1a(`${title}:${state.clock + 1}`).slice(0, 4)}`
      const id = state.tasks.some((task) => task.id === hashId) ? `t-n${state.clock + 1}` : hashId
      const created = {
        id,
        title,
        tags,
        status: 'todo',
        due,
        dueToday: Boolean(due && due.slice(0, 10) === ARK_TASKS_NOW.slice(0, 10)),
        desc: action.desc ? String(action.desc).trim() || undefined : undefined,
        source: 'ark(plugin:tasks)'
      }
      const tasks = [created, ...cloneTasks(state.tasks)]
      return say(
        withSnapshot(
          state,
          {
            kind: 'tasks',
            source: 'ark(plugin:tasks)',
            message: `ark(plugin:tasks): create ${created.id} ${created.title}`,
            diff: diffLines(taskLines(state.tasks), taskLines(tasks)),
            previousTasks: cloneTasks(state.tasks)
          },
          { workspaceTab: 'tasks', tasks }
        ),
        'agent',
        `已新建任务「${created.title}」（${created.id} · ${created.tags.map((g) => `#${g}`).join(' ')}），直接落盘并生成快照。`
      )
    }

    case 'move-task': {
      const target = state.tasks.find((task) => task.id === action.id)
      if (!target || target.status === action.status) return state
      const tasks = state.tasks.map((task) => {
        if (task.id !== action.id) return cloneTask(task)
        return {
          ...cloneTask(task),
          status: action.status,
          completed: action.status === 'done' ? task.completed || ARK_TASKS_NOW : undefined
        }
      })
      const label = { todo: '待办', doing: '进行中', done: '已完成' }[action.status]
      return say(
        withSnapshot(
          state,
          {
            kind: 'tasks',
            source: 'ark(plugin:tasks)',
            message: `ark(plugin:tasks): 将 ${target.id} 移到 ${action.status}`,
            diff: diffLines(taskLines(state.tasks), taskLines(tasks)),
            previousTasks: cloneTasks(state.tasks)
          },
          { tasks }
        ),
        'agent',
        `任务「${target.title}」已移到${label}。看板变更与 context.md 同步生效，已落快照。`
      )
    }

    case 'generate-task-review': {
      const period = action.period
      if (period !== 'week' && period !== 'month' && period !== 'year') return state
      const filter = { tag: action.tag || 'all', query: (action.query || '').trim() }
      const monthKey = action.month || '2026-11'
      const meta =
        period === 'week'
          ? { label: '周报', file: '2026-W47.md', scope: '2026-W47（11-16 至 11-22）' }
          : period === 'month'
            ? { label: '月报', file: `${monthKey}.md`, scope: monthKey }
            : { label: '年报', file: '2026.md', scope: '2026 全年' }
      const path = `Ark 工作区/tasks/reviews/${meta.file}`
      const matchedDone = state.tasks
        .filter((task) => {
          if (!taskMatchesFilter(task, filter)) return false
          if (task.status !== 'done' || !task.completed) return false
          if (period === 'week') return isSameTaskWeek(task.completed)
          if (period === 'month') return task.completed.slice(0, 7) === monthKey
          return task.completed.slice(0, 4) === '2026'
        })
        .sort((a, b) => (b.completed < a.completed ? -1 : 1))

      const filterSummary = `${filter.tag === 'all' ? '全部标签' : `标签:${filter.tag}`}${
        filter.query ? ` · 搜索:“${filter.query}”` : ''
      }`
      const bodyLines = matchedDone.length
        ? matchedDone.map(
            (task) =>
              `- [[tasks/${task.id}|${task.title}]]（${task.tags.map((g) => `#${g}`).join(' ')} · ✓ ${task.completed.slice(0, 10)}）`
          )
        : ['- 当前回顾筛选下暂无完成记录']
      const content = [
        '---',
        `title: ${meta.scope} 任务${meta.label}`,
        `filter: "${filterSummary}"`,
        `completed_count: ${matchedDone.length}`,
        '---',
        '',
        `## 完成清单（${matchedDone.length} 件）`,
        ...bodyLines
      ].join('\n')

      const existing = state.taskReviews.find((item) => item.path === path)
      if (existing && existing.content === content) return state

      const review = {
        id: `review-${state.clock + 1}`,
        period,
        label: meta.label,
        path,
        filterTag: filter.tag,
        filterQuery: filter.query,
        completedCount: matchedDone.length,
        content,
        at: state.clock + 1
      }
      const nextReviews = existing
        ? state.taskReviews.map((item) => (item.path === path ? review : cloneReview(item)))
        : [...state.taskReviews.map(cloneReview), review]

      return say(
        withSnapshot(
          state,
          {
            kind: 'tasks',
            source: 'ark(plugin:tasks)',
            message: `ark(plugin:tasks): review ${path}`,
            diff: diffLines(existing ? existing.content : '', content),
            previousTaskReviews: state.taskReviews.map(cloneReview),
            reviewPath: path
          },
          { workspaceTab: 'tasks', taskReviews: nextReviews }
        ),
        'agent',
        `已生成${meta.label}：${path}（遵循当前回顾筛选，收录 ${matchedDone.length} 条可 [[链接]] 完成项，支持一键撤销）。`
      )
    }

    case 'run-channel-action': {
      const channel = channelOf(action.host)
      if (!channel) return state

      switch (action.action) {
        case 'organize-note':
          return dispatch(state, { type: 'organize-note' })

        case 'inspect-history':
          return { ...state, sidebarTab: 'history' }

        case 'request-agentmail-send':
          return dispatch(state, { type: 'request-agentmail-send' })

        case 'collect-submit':
          return dispatch(state, {
            type: 'collect-submit',
            url: 'https://www.bilibili.com/video/BV1GJ411x7h7',
            host: action.host
          })

        case 'list-tasks': {
          const open = state.tasks.filter((task) => task.status !== 'done')
          return say(
            { ...state, sidebarTab: 'chat' },
            'agent',
            `${channel.name} 查到 ${open.length} 个未完成任务：${open
              .map((task) => task.title)
              .join('；')}`,
            [
              {
                tool: 'tasks_list_tasks',
                arg: channel.host,
                result: `返回 ${state.tasks.length} 条`,
                ms: 9
              },
              {
                tool: 'tasks_today',
                arg: '今日到期 / 已逾期',
                result: `今日到期 ${state.tasks.filter((task) => isTaskDueToday(task)).length} 条 · 已逾期 ${
                  state.tasks.filter((task) => isTaskOverdue(task)).length
                } 条`,
                ms: 6
              }
            ]
          )
        }

        case 'resume-thread':
          return say(
            { ...state, sidebarTab: 'chat' },
            'agent',
            `${channel.name} 恢复线程 ${state.thread.slug}（${state.thread.rev}）：${state.thread.summary}`,
            [
              {
                tool: 'context_resume',
                arg: state.thread.slug,
                result: `rev ${state.thread.rev}`,
                ms: 12
              }
            ]
          )

        case 'recall-memory': {
          const inferred = state.memories.filter((memory) => memory.status === 'inferred')
          return say(
            { ...state, sidebarTab: 'chat' },
            'agent',
            `${channel.name} 召回 ${state.memories.length} 条记忆，其中 ${inferred.length} 条标了${MEMORY_INFERRED_PREFIX}，不计入常驻层。`,
            [
              {
                tool: 'memory_search_memory',
                arg: '全部',
                result: `${state.memories.length} 条`,
                ms: 7
              }
            ]
          )
        }

        case 'save-thread':
          return dispatch(state, {
            type: 'save-thread',
            host: action.host,
            baseRev: CURRENT_REV,
            summary: state.thread.summary
          })

        default:
          return state
      }
    }

    case 'request-agentmail-send': {
      if (state.pendingAction && state.pendingAction.status === 'pending') return state
      const clock = state.clock + 1
      const pending = {
        id: `pa-${clock}`,
        channel: 'agentmail',
        tool: 'agentmail_send',
        summary: '把本轮对话的三条结论外发到 demo@example.com（主题：Ark v2 采集链路小结）',
        payloadPreview: {
          to: 'demo@example.com',
          subject: 'Ark v2 采集链路小结',
          body: `${state.thread.summary}\n- Collect 已完成 ${
            state.collectItems.filter((item) => item.status === 'done').length
          } 条入库`,
          via: '标准 MCP 扩展接入（IMAP/SMTP）'
        },
        status: 'pending'
      }
      return say(
        { ...state, pendingAction: pending, sidebarTab: 'chat', clock },
        'agent',
        '整理好了。发给外部邮箱是撤不回来的动作，所以先挂一张确认卡：批准才发，拒绝我把结果回填给模型。'
      )
    }

    case 'resolve-pending-action': {
      const pending = state.pendingAction
      if (!pending || pending.status !== 'pending') return state

      if (action.decision === 'approve') {
        return say(
          {
            ...state,
            pendingAction: { ...pending, status: 'approved' },
            mail: { sentCount: state.mail.sentCount + 1, refusal: state.mail.refusal }
          },
          'agent',
          `已批准，邮件已通过 AgentMail 发出（第 ${
            state.mail.sentCount + 1
          } 封）。这次没有 Vault 写入，所以不产生快照。`
        )
      }

      return say(
        {
          ...state,
          pendingAction: { ...pending, status: 'rejected' },
          mail: {
            sentCount: state.mail.sentCount,
            refusal: '用户拒绝外发，邮件未发送；拒绝结果已回填给模型。'
          }
        },
        'agent',
        '已拒绝：邮件未发送，外部没有任何副作用。拒绝结果回填给模型，这轮到此结束。'
      )
    }

    case 'confirm-memory': {
      const target = state.memories.find((memory) => memory.id === action.id)
      if (!target || target.status === 'confirmed') return state
      const via = action.host || target.via
      const memories = state.memories.map((memory) =>
        memory.id === action.id ? { ...memory, status: 'confirmed', via } : memory
      )
      const clock = state.clock + 1
      return {
        ...state,
        memories,
        clock,
        chat: [
          ...state.chat,
          {
            id: `msg-${clock}`,
            role: 'agent',
            text: `记忆 ${action.id} 已确认，via=${via}。它从这轮起进入 2k 常驻层。`,
            at: clock
          }
        ]
      }
    }

    case 'downgrade-by-channel': {
      const affected = state.memories.filter(
        (memory) => memory.status === 'confirmed' && memory.via === action.host
      )
      if (!affected.length) return state
      const memories = state.memories.map((memory) =>
        affected.some((entry) => entry.id === memory.id)
          ? { ...memory, status: 'inferred' }
          : memory
      )
      const clock = state.clock + 1
      return {
        ...state,
        memories,
        clock,
        chat: [
          ...state.chat,
          {
            id: `msg-${clock}`,
            role: 'agent',
            text: `已按通道降级 ${affected.length} 条（via=${action.host}）：${affected
              .map((memory) => memory.id)
              .join('、')}。其他通道确认的不受影响。`,
            at: clock
          }
        ]
      }
    }

    case 'save-thread': {
      const baseRev = action.baseRev === CURRENT_REV ? state.thread.rev : action.baseRev
      if (baseRev !== state.thread.rev) {
        const clock = state.clock + 1
        const conflict = {
          id: `conflict-${clock}`,
          host: action.host,
          baseRev,
          incomingSummary: action.summary,
          incomingAt: clock
        }
        return {
          ...state,
          clock,
          thread: {
            ...state.thread,
            pendingConflicts: [...state.thread.pendingConflicts, conflict]
          },
          chat: [
            ...state.chat,
            {
              id: `msg-${clock}`,
              role: 'system',
              text: `base_rev ${baseRev} 已过期（当前 ${state.thread.rev}）。${action.host} 的这次保存没有覆盖线程，落进 ark/threads/${state.thread.slug}.pending/ 待合并。`,
              at: clock
            }
          ]
        }
      }

      const clock = state.clock + 1
      const rev = `rev-${fnv1a(
        `${state.thread.slug}|${action.summary}|${action.host}|${state.thread.rev}`
      )}`
      return {
        ...state,
        clock,
        thread: { ...state.thread, rev, summary: action.summary, updatedBy: action.host },
        chat: [
          ...state.chat,
          {
            id: `msg-${clock}`,
            role: 'agent',
            text: `Live State 已由 ${action.host} 保存，${state.thread.rev} → ${rev}。`,
            at: clock
          }
        ]
      }
    }

    case 'run-scenario':
      return runScenario(action.scenario)

    case 'reset':
      return createInitialState()

    default:
      return state
  }
}

/* ── preset scenarios ──────────────────────────────────────────────────── */

/**
 * Each scenario is a short click list, replayed from a fresh state. Deriving the
 * end state from the same actions the buttons fire is what makes switching and
 * reset idempotent: the run has no memory of the previous run.
 */
export function scenarioActions(scenario) {
  switch (scenario) {
    case 'cross-channel-collect-mail':
      return [
        {
          type: 'collect-submit',
          url: 'https://www.bilibili.com/video/BV1GJ411x7h7',
          host: 'astrbot-qq'
        },
        { type: 'collect-finish', id: 'c5' },
        { type: 'request-agentmail-send' }
      ]

    case 'vault-write-and-undo':
      return [
        { type: 'organize-note' },
        { type: 'set-sidebar-tab', tab: 'history' },
        { type: 'undo-latest' }
      ]

    case 'memory-and-concurrency':
      return [
        { type: 'set-sidebar-tab', tab: 'memory' },
        { type: 'confirm-memory', id: 'm1', host: 'claude-code' },
        {
          type: 'save-thread',
          host: 'obsidian',
          baseRev: CURRENT_REV,
          summary: '桌面端接上：先把 note 与 collect 两栏做实，再谈渠道。'
        },
        {
          type: 'save-thread',
          host: 'claude-code',
          baseRev: STALE_BASE_REV,
          summary: '终端这边的结论：只做两栏就够。'
        },
        { type: 'set-workspace-tab', tab: 'channels' }
      ]

    default:
      return []
  }
}

export function runScenario(scenario) {
  const start = { ...createInitialState(), scenario }
  return scenarioActions(scenario).reduce((current, action) => dispatch(current, action), start)
}

/* ── 主题：优先读演示键，其次继承主站 theme 键，缺省跟随 prefers-color-scheme ── */
function readTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY)
    if (saved === 'light' || saved === 'dark') return saved
    const siteTheme = localStorage.getItem('theme')
    if (siteTheme === 'light' || siteTheme === 'dark') return siteTheme
  } catch (error) {
    /* 隐私模式下 localStorage 会抛，退回系统偏好 */
  }
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
    ? 'light'
    : 'dark'
}

function applyTheme() {
  document.documentElement.dataset.theme = ui.theme
  $('#themeBtn').title = ui.theme === 'dark' ? '切到浅色' : '切到深色'
}

function persistTheme() {
  try {
    localStorage.setItem(THEME_KEY, ui.theme)
  } catch (error) {
    /* 存不下就算了，本次会话仍然生效 */
  }
}

let toastTimer = 0
function toast(text) {
  const node = $('#toast')
  node.textContent = text
  node.classList.add('on')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => node.classList.remove('on'), 2600)
}

function tabBar(labels, current, kind) {
  const hasPending = Boolean(state.pendingAction && state.pendingAction.status === 'pending')
  return Object.entries(labels)
    .map(([id, label]) => {
      const badge =

            ? `<span class="badge-count">${state.memories.filter((m) => m.status === 'inferred').length}</span>`
            : id === 'history'

function diffBlock(diff) {
  const rows = diff
    .split('\n')
    .slice(0, 14)
    .map((line) => {
      const cls = line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del' : 'ctx'
      return `<div class="${cls}">${esc(line)}</div>`
    })
    .join('')
  return `<div class="diff">${rows}</div>`
}

function noteLines(content) {
  return content
    .split('\n')
    .map((line, index) => {
      const cls = /^---$/.test(line)
        ? 'fm'
        : /^(title|tags|updated|thread|status):/.test(line)
          ? 'key'
          : /^#{1,6}\s/.test(line)
            ? 'head'
            : /^-\s/.test(line)
              ? 'li'
              : ''
      const text = esc(line).replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>')
      return `<div class="ln ${cls}"><span class="ln-no">${index + 1}</span><span class="ln-txt">${text || ' '}</span></div>`
    })
    .join('')
}

function traceBlock(message) {
  if (!message.trace || !message.trace.length) return ''
  const steps = message.trace
    .map(
      (step) => `<li class="step">
        <div class="step-head"><span class="step-tool">${esc(step.tool)}</span>
          ${step.arg ? `<span class="step-arg">${esc(step.arg)}</span>` : ''}
          <span class="step-ms">${step.ms}ms</span></div>
        <div class="step-result">${esc(step.result)}</div>
      </li>`
    )
    .join('')
  const total = message.trace.reduce((sum, step) => sum + step.ms, 0)
  return `<details class="trace">
    <summary>工具调用轨迹<span class="trace-stats">${message.trace.length} 步 · ${total}ms</span></summary>
    <div class="trace-body"><ul class="steps">${steps}</ul></div>
  </details>`
}
