function renderTasksWeek(wbFilter) {
  const vis = state.tasks.filter((task) => taskMatchesFilter(task, wbFilter))
  const doneInWeek = vis.filter(
    (task) => task.status === 'done' && task.completed && isSameTaskWeek(task.completed)
  )
  const dueInWeek = vis.filter(
    (task) => task.status !== 'done' && task.due && isSameTaskWeek(task.due)
  )
  const overdue = vis.filter((task) => isTaskOverdue(task))
  const denom = doneInWeek.length + dueInWeek.length + overdue.length
  const rate = denom ? `${Math.round((doneInWeek.length / denom) * 100)}%` : '—'
  const todayDate = ARK_TASKS_NOW.slice(0, 10)
  const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日']

  const cols = ARK_TASKS_WEEK_DATES.map((iso, idx) => {
    const dueItems = vis.filter(
      (task) => task.status !== 'done' && task.due && task.due.slice(0, 10) === iso
    )
    const doneItems = vis.filter(
      (task) => task.status === 'done' && task.completed && task.completed.slice(0, 10) === iso
    )
    const chips = [
      ...dueItems.map((task) => `<div class="wchip" title="${esc(task.title)}">${esc(task.title)}</div>`),
      ...doneItems.map((task) => `<div class="wchip done" title="已完成：${esc(task.title)}">✓ ${esc(task.title)}</div>`)
    ].join('')
    return `<div class="day-col ${iso === todayDate ? 'today-col' : ''}">
      <div class="day-h">${weekdays[idx]} ${iso.slice(5)}</div>
      ${chips || '<span style="color:var(--faint);font-size:11px">—</span>'}
    </div>`
  }).join('')

  return `<div class="wb-stats">
      <div class="wb-stat"><div class="s-num">${dueInWeek.length}</div><div class="s-lbl">本周待完成截止</div></div>
      <div class="wb-stat done"><div class="s-num">${doneInWeek.length}</div><div class="s-lbl">本周已完成</div></div>
      <div class="wb-stat over"><div class="s-num">${overdue.length}</div><div class="s-lbl">逾期积压</div></div>
      <div class="wb-stat rate"><div class="s-num">${rate}</div><div class="s-lbl">周推进率</div></div>
    </div>
    <div class="wb-box"><div class="wb-week">${cols}</div></div>`
}

function renderTasksMonth(wbFilter) {
  const y = ui.wbYear
  const m = ui.wbMonth
  const monthPrefix = `${y}-${String(m + 1).padStart(2, '0')}`
  const vis = state.tasks.filter((task) => taskMatchesFilter(task, wbFilter))
  const shift = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7
  const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate()
  const todayIso = ARK_TASKS_NOW.slice(0, 10)

  const heads = ['一', '二', '三', '四', '五', '六', '日']
    .map((w) => `<div class="mhead">${w}</div>`)
    .join('')
  const dims = Array.from({ length: shift }, () => '<div class="mcell dim"></div>').join('')

  let dueCnt = 0
  let doneCnt = 0
  const cells = []
  for (let d = 1; d <= days; d += 1) {
    const iso = `${monthPrefix}-${String(d).padStart(2, '0')}`
    const due = vis.filter((task) => task.status !== 'done' && task.due && task.due.slice(0, 10) === iso)
    const done = vis.filter(
      (task) => task.status === 'done' && task.completed && task.completed.slice(0, 10) === iso
    )
    dueCnt += due.length
    doneCnt += done.length
    cells.push(`<div class="mcell ${iso === todayIso ? 'today-cell' : ''}">
      <div class="mcell-d"><span>${d}</span>${done.length ? `<span class="mcell-ok">✓${done.length}</span>` : ''}</div>
      ${due.map((task) => `<div class="mchip" title="${esc(task.title)}">${esc(task.title)}</div>`).join('')}
      ${done.map((task) => `<div class="mchip done" title="已完成：${esc(task.title)}">✓ ${esc(task.title)}</div>`).join('')}
    </div>`)
  }

  const monthDone = vis
    .filter((task) => task.status === 'done' && task.completed && task.completed.slice(0, 7) === monthPrefix)
    .sort((a, b) => (b.completed < a.completed ? -1 : 1))

  return `<div class="cal-top">
      <button class="btn btn-xs" data-act="wb-month-prev" title="上个月">◀</button>
      <span class="cal-mon">${y} 年 ${m + 1} 月</span>
      <button class="btn btn-xs" data-act="wb-month-next" title="下个月">▶</button>
      <button class="btn btn-xs" data-act="wb-month-now">本月</button>
      <span class="cal-line">当月待办截止 <span class="num">${dueCnt}</span> 件 · 已完成 <span class="num">${doneCnt}</span> 件（当前回顾筛选）</span>
    </div>
    <div class="wb-mgrid">${heads}${dims}${cells.join('')}</div>
    <div class="wb-sec-title">本月完成清单 <span class="tpill">${monthDone.length} 件</span></div>
    <div class="wb-dlist">${renderDoneListRows(monthDone)}</div>`
}

function renderTasksYear(wbFilter) {
  const summary = taskYearSummary(state.tasks, wbFilter)
  const { totalTracked, yearDone, overdueCount, completionRate, byMonth, flow } = summary
  const heatCells = byMonth
    .map((count, idx) => {
      const lv = count === 0 ? 'lv0' : count <= 2 ? 'lv1' : 'lv2'
      return `<button class="ycell ${lv}" data-act="wb-pick-month" data-month="${idx}" title="查看 2026 年 ${idx + 1} 月日历明细">
        <span class="ycell-m"><span>${idx + 1} 月</span><span class="ycell-sub">${count ? `${count} 件` : '—'}</span></span>
        <span class="ycell-cnt">${count}</span>
      </button>`
    })
    .join('')

  const maxFlow = Math.max(1, ...flow.rows.map((row) => row.count))
  const flowSub =
    flow.mode === 'distribution'
      ? '当年完成数按标签统计 · 点击任一条形或标签名深入查看其共现标签构成'
      : `含「${esc(flow.pivotTag)}」的 ${flow.totalDone} 件完成任务中，其他共现标签占比 · 点击可继续切换筛选`
  const flowBars = flow.rows.length
    ? flow.rows
        .map(
          (row) => `<button class="wb-frow" data-act="wb-pivot-tag" data-tag="${esc(row.tag)}" title="将回顾筛选切到「${esc(row.tag)}」">
            <span class="wb-fname">${esc(row.tag)}</span>
            <span class="wb-ftrack"><span class="wb-ffill" style="width:${Math.max(8, Math.round((row.count / maxFlow) * 100))}%">${row.count}</span></span>
            <span class="wb-fpct">${row.pct}%</span>
          </button>`
        )
        .join('')
    : '<div style="color:var(--faint);font-size:12px;padding:4px 0">该筛选下暂无其他共现标签</div>'

  return `<div class="wb-stats">
      <div class="wb-stat"><div class="s-num">${totalTracked}</div><div class="s-lbl">本年纳入统计</div></div>
      <div class="wb-stat done"><div class="s-num">${yearDone.length}</div><div class="s-lbl">已完成（当前回顾筛选）</div></div>
      <div class="wb-stat over"><div class="s-num">${overdueCount}</div><div class="s-lbl">逾期未完成</div></div>
      <div class="wb-stat rate"><div class="s-num">${totalTracked ? `${completionRate}%` : '—'}</div><div class="s-lbl">完成率</div></div>
    </div>
    <div class="wb-sec-title">12 月完成热力 <span class="wb-sec-sub">lv0 / lv1 / lv2 随回顾筛选实时重算 · 点击月份可切入月历</span></div>
    <div class="wb-ygrid">${heatCells}</div>
    <div class="wb-sec-title">
      <span>精力流向 · ${flow.mode === 'distribution' ? '标签分布' : `「${esc(flow.pivotTag)}」共现标签构成`}</span>
      <span class="wb-sec-sub">${flowSub}</span>
      ${
        flow.mode === 'cooccurrence'
          ? '<button class="btn btn-xs btn-ghost" data-act="wb-tag" data-tag="all" style="margin-left:auto">← 返回全部标签</button>'
          : ''
      }
    </div>
    <div class="wb-box"><div class="wb-flow">${flowBars}</div></div>
    <div class="wb-sec-title">完成清单 <span class="tpill">${yearDone.length} 件</span></div>
    <div class="wb-dlist">${renderDoneListRows(yearDone)}</div>`
}

function renderTasks() {
  const tags = taskTagCounts(state.tasks)
  const boardFilter = { tag: ui.boardTag, query: ui.boardQuery }
  const wbFilter = { tag: ui.wbTag, query: ui.wbQuery }

  const vis = state.tasks.filter((task) => taskMatchesFilter(task, boardFilter))
  const open = vis.filter((task) => task.status !== 'done')
  const overdue = open.filter((task) => isTaskOverdue(task))
  const todayOnly = open.filter((task) => isTaskDueToday(task) && !isTaskOverdue(task))
  const todoList = vis.filter((task) => task.status === 'todo')
  const doingList = vis.filter((task) => task.status === 'doing')
  const doneThisWeek = vis.filter(
    (task) => task.status === 'done' && task.completed && isSameTaskWeek(task.completed)
  )
  const doneEarly = vis.filter(
    (task) => task.status === 'done' && !(task.completed && isSameTaskWeek(task.completed))
  )

  const renderTagFilterBar = (activeTag, actName) =>
    [
      `<button class="tchip ${activeTag === 'all' ? 'on' : ''}" data-act="${actName}" data-tag="all">全部</button>`,
      ...tags.map(
        (entry) =>
          `<button class="tchip ${activeTag === entry.tag ? 'on' : ''}" data-act="${actName}" data-tag="${esc(entry.tag)}">${esc(entry.tag)}<span class="tchip-n">${entry.count}</span></button>`
      )
    ].join('')

  const quickAdd = ui.quickAddOpen
    ? `<form class="task-quick-add" id="taskQuickForm">
        <input id="quickTaskTitle" type="text" data-input="quick-title" required
          value="${esc(ui.quickAddTitle)}" placeholder="输入新任务标题，回车直接写入看板…" aria-label="新任务标题">
        <span class="task-quick-lbl">多选标签：</span>
        <div class="tagchips">
          ${QUICK_TAG_CANDIDATES.map(
            (tag) =>
              `<button type="button" class="tchip ${ui.quickAddTags.includes(tag) ? 'on' : ''}" data-act="quick-tag-toggle" data-tag="${esc(tag)}">${esc(tag)}</button>`
          ).join('')}
        </div>
        <button type="button" class="tchip ${ui.quickAddDueToday ? 'on' : ''}" data-act="quick-due-toggle">
          ${ui.quickAddDueToday ? '✓ 今日截止 20:00' : '无截止'}
        </button>
        <button class="btn btn-primary btn-xs" type="submit">创建并记快照</button>
        <button class="btn btn-ghost btn-xs" type="button" data-act="task-quick-toggle">取消</button>
      </form>`
    : ''

  const focusItems = [...overdue, ...todayOnly]
  const focusBanner = focusItems.length
    ? `<div class="tasks-focus ${overdue.length === 0 ? 'only-today' : ''}">
        ${focusItems
          .map((task) => {
            const kind = isTaskOverdue(task) ? 'over' : 'today'
            const whenLabel =
              kind === 'over'
                ? `已逾期 · ${(task.due || '').slice(5, 16).replace('T', ' ')}`
                : `今日 ${(task.due || '').slice(11, 16) || '到期'}`
            return `<div class="fitem ${kind}">
              <span class="fitem-dot"></span>
              <span class="fitem-main">
                <b>${esc(task.title)}</b>
                ${task.tags.map((tag) => `<span class="ttag">${esc(tag)}</span>`).join('')}
                <span class="tpill tid" style="margin-left:0">${esc(task.id)}</span>
              </span>
              <span class="fitem-when">${esc(whenLabel)}</span>
              <button class="btn btn-xs btn-ghost" data-act="task-move" data-id="${esc(task.id)}" data-status="done">→ 已完成</button>
            </div>`
          })
          .join('')}
      </div>`
    : ''

  const renderCard = (task) => {
    const duePill =
      task.status === 'done' && task.completed
        ? `<span class="tpill due-done">✓ ${esc(task.completed.slice(5, 16).replace('T', ' '))}</span>`
        : task.due
          ? `<span class="tpill ${isTaskOverdue(task) ? 'due-over' : isTaskDueToday(task) ? 'due-today' : ''}">${esc(
              task.due.slice(0, 16).replace('T', ' ')
            )}</span>`
          : '<span class="tpill">无截止 · 不提醒</span>'
    const parentPill = task.parent
      ? `<span class="tpill parent">↳ ${esc(task.parent)} · ${esc(task.progress || '')} 完成</span>`
      : ''
    const transitions = ['todo', 'doing', 'done']
      .filter((col) => col !== task.status)
      .map(
        (col) =>
          `<button class="btn btn-xs btn-ghost" data-act="task-move" data-id="${esc(task.id)}" data-status="${col}">→ ${TASK_LABELS[col]}</button>`
      )
      .join('')
    return `<article class="task ${task.status}">
      <div class="task-title">${esc(task.title)}</div>
      <div class="task-tags">
        ${task.tags
          .map(
            (tag) =>
              `<button class="ttag" data-act="board-tag" data-tag="${esc(tag)}" title="按标签「${esc(tag)}」筛选看板">${esc(tag)}</button>`
          )
          .join('')}
      </div>
      <div class="task-meta">${duePill}${parentPill}<span class="tpill tid">${esc(task.id)}</span></div>
      ${task.desc ? `<div class="task-desc">${esc(task.desc)}</div>` : ''}
      <div class="task-foot">
        <span class="badge ${SOURCE_CLASS(task.source)}">${esc(task.source)}</span>
        <span class="task-move">${transitions}</span>
      </div>
    </article>`
  }

  const renderCol = (status, title, countText, items, footerHtml = '') => `
    <section class="col" data-state="${status}">
      <div class="col-head"><span class="col-dot"></span><span>${title}</span><span class="n">${esc(countText)}</span></div>
      <div class="col-slot">${items.map(renderCard).join('') || '<div class="col-empty">没有匹配的任务</div>'}</div>
      ${footerHtml}
    </section>`

  const earlyLink = doneEarly.length
    ? `<button class="more-done" data-act="tasks-jump-wb">更早的 ${doneEarly.length} 条完成 → 见下方工作台 月 / 年视图</button>`
    : ''

  const activeWbFilterNote =
    ui.wbTag !== 'all' || ui.wbQuery
      ? `<span class="wb-filter-note">当前回顾筛选：${ui.wbTag === 'all' ? '全部标签' : esc(ui.wbTag)}${
          ui.wbQuery ? ` · “${esc(ui.wbQuery)}”` : ''
        } <button class="btn btn-xs btn-ghost" data-act="wb-clear-filter">清除</button></span>`
      : ''

  const generatedReviewsStrip = state.taskReviews.length
    ? `<div class="wb-reviews">
        ${state.taskReviews
          .map((rev) => {
            const open = ui.previewReviewPath === rev.path
            return `<div>
              <div class="wb-rev-row">
                <span class="badge plugin">ark(plugin:tasks)</span>
                <code style="font-size:11.5px;color:var(--text)">${esc(rev.path)}</code>
                <span style="color:var(--muted)">收录 ${rev.completedCount} 件</span>
                <span class="spacer"></span>
                <button class="btn btn-xs btn-ghost" data-act="wb-preview-review" data-path="${esc(rev.path)}">${
                  open ? '收起内容' : '查看 Markdown'
                }</button>
                <button class="btn btn-xs" data-act="undo-latest">撤销最新写入</button>
              </div>
              ${open ? `<pre class="wb-rev-pre">${esc(rev.content)}</pre>` : ''}
            </div>`
          })
          .join('')}
      </div>`
    : ''

  const wbBody =
    ui.wbView === 'week'
      ? renderTasksWeek(wbFilter)
      : ui.wbView === 'month'
        ? renderTasksMonth(wbFilter)
        : renderTasksYear(wbFilter)

  return `<div class="tasks-wrap">
    <div class="tasks-head">
      <span class="t-search">${SEARCH_ICON}<input id="tasksBoardSearch" type="search" data-input="board-query"
        value="${esc(ui.boardQuery)}" placeholder="搜索看板任务…" aria-label="搜索看板任务"></span>
      <div class="tagchips">${renderTagFilterBar(ui.boardTag, 'board-tag')}</div>
      <div class="tasks-summary">
        <span class="schip over"><span>已逾期</span><b>${overdue.length}</b></span>
        <span class="schip today"><span>今天</span><b>${todayOnly.length}</b></span>
        <span class="schip"><span>待办</span><b>${todoList.length}</b></span>
        <span class="schip"><span>进行中</span><b>${doingList.length}</b></span>
        <button class="btn btn-primary btn-xs" data-act="task-quick-toggle">${
          ui.quickAddOpen ? '收起新建' : '＋ 新建任务'
        }</button>
      </div>
    </div>
    ${quickAdd}
    ${focusBanner}
    <div class="board">
      ${renderCol('todo', '待办', String(todoList.length), todoList)}
      ${renderCol('doing', '进行中', String(doingList.length), doingList)}
      ${renderCol('done', '已完成', `本周 ${doneThisWeek.length}`, doneThisWeek, earlyLink)}
    </div>
    <div class="ctx-preview">
      <h4>插件注入的 context.md 预览 · 今日到期</h4>
      <pre>${esc(taskContextPreview(state))}</pre>
    </div>
    <section class="wb" id="tasksWorkbench">
      <div class="wb-head">
        <button class="wb-toggle" data-act="wb-toggle" aria-expanded="${ui.wbOpen}">
          <span class="wb-caret">${ui.wbOpen ? '▾' : '▸'}</span><strong>工作台</strong>
        </button>
        <div class="wb-tabs" role="tablist" aria-label="回顾周期切换">
          <button class="wtab ${ui.wbView === 'week' ? 'on' : ''}" data-act="wb-tab" data-view="week">周</button>
          <button class="wtab ${ui.wbView === 'month' ? 'on' : ''}" data-act="wb-tab" data-view="month">月</button>
          <button class="wtab ${ui.wbView === 'year' ? 'on' : ''}" data-act="wb-tab" data-view="year">年</button>
        </div>
        <span class="wb-head-note">现算 · 不产生文件</span>
      </div>
      ${
        ui.wbOpen
          ? `<div class="wb-filter">
              <span class="wb-lbl">回顾筛选：</span>
              <div class="tagchips">${renderTagFilterBar(ui.wbTag, 'wb-tag')}</div>
              <span class="t-search">${SEARCH_ICON}<input id="tasksReviewSearch" type="search" data-input="wb-query"
                value="${esc(ui.wbQuery)}" placeholder="搜索历史任务…" aria-label="搜索历史任务"></span>
              ${activeWbFilterNote}
            </div>
            <div class="wb-genbar">
              <span class="wb-lbl">生成记录（手动）：</span>
              <button class="btn btn-xs" data-act="task-gen-review" data-period="week">生成周报</button>
              <button class="btn btn-xs" data-act="task-gen-review" data-period="month">生成月报</button>
              <button class="btn btn-xs" data-act="task-gen-review" data-period="year">生成年报</button>
              <span class="wb-gen-hint">→ Ark 工作区/tasks/reviews/ · 可撤销 · 可 [[链接]] · 记录遵循当前回顾筛选</span>
            </div>
            ${generatedReviewsStrip}
            ${wbBody}`
          : ''
      }
    </section>
    <p class="ssub">标签自由多选 · 筛选单个标签时「精力流向」自动切换为其共现标签构成 · 看板流转、新建任务与手动生成周/月/年报均写入 <span class="mono">ark(plugin:tasks)</span> 快照并可一键撤销。</p>
  </div>`
}

function renderChannels() {
  const cards = ARK_CHANNELS.map((channel) => {
    const confirmed = state.memories.filter(
      (m) => m.status === 'confirmed' && m.via === channel.host
    ).length
    const pendingHere =
      state.pendingAction && state.pendingAction.status === 'pending' && channel.host === 'agentmail'
    const actions = channel.actions
      .map(
        (action) => `<button class="btn btn-xs" data-act="channel-action" data-host="${channel.host}"
          data-channel-action="${action.id}">${esc(action.label)}</button>`
      )
      .join('')
    return `<div class="channel">
      <div class="channel-top">
        <span class="channel-name">${esc(channel.name)}</span>
        <span class="grade ${channel.grade === 'verified' ? 'verified' : 'mcp'}">${esc(channel.gradeLabel)}</span>
      </div>
      <p class="channel-detail">${esc(channel.detail)}</p>
      <div class="channel-actions">${actions}</div>
      <div class="channel-state">
        <span>${channel.host}</span><span>·</span>
        <span>${confirmed} 条已确认记忆经此通道</span>
        ${pendingHere ? '<span class="spacer"></span><span style="color:var(--warn)">待确认外发</span>' : ''}
        ${channel.grade === 'mcp-extension' ? '<span class="spacer"></span><span style="color:var(--warn)">未实机验收</span>' : ''}
      </div>
    </div>`
  }).join('')

  const conflicts = state.thread.pendingConflicts.length
    ? state.thread.pendingConflicts
        .map(
          (conflict) => `<div class="conflict">
            <div class="cf-head">.pending · ${esc(conflict.host)}</div>
            <span>base_rev ${esc(conflict.baseRev)} 已过期，本次保存没有覆盖线程。</span>
            <span style="color:var(--muted)">待合并内容：${esc(conflict.incomingSummary)}</span>
          </div>`
        )
        .join('')
    : '<p class="ssub" style="margin-top:6px">没有待合并的过期写入。</p>'

  return `<div class="channels">${cards}</div>
    <div class="thread-card card">
      <h4>Live State · ark/threads/${esc(state.thread.slug)}.md</h4>
      <div class="kv"><span class="mono">rev</span><span class="mono">${esc(state.thread.rev)}</span>
        <span class="spacer"></span><span>updated_by ${esc(state.thread.updatedBy)}</span></div>
      <p class="ssub" style="margin:6px 0 8px">${esc(state.thread.summary)}</p>
      <div class="channel-actions">
        <button class="btn btn-xs" data-act="save-thread" data-host="obsidian" data-base="current">Obsidian 保存（base_rev 最新）</button>
        <button class="btn btn-xs" data-act="save-thread" data-host="claude-code" data-base="stale">Claude Code 保存（base_rev 过期）</button>
      </div>
      ${conflicts}
    </div>
    <p class="ssub" style="padding:0 14px 20px">同一份 Live State 只有一个 rev。过期 base_rev 的保存不会「后写覆盖」，而是落进 <span class="mono">.pending/</span> 等用户合并 —— 上面这排按钮就是验证这一点的地方。</p>`
}

let lastWorkspaceTab = state.workspaceTab
function renderWorkspace() {
  const wsPane = $('#wsPane')
  const active = document.activeElement
  const keepFocus =
    active && wsPane.contains(active) && active.id
      ? {
          id: active.id,
          start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
          end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null
        }
      : null
  const prevScroll = lastWorkspaceTab === state.workspaceTab ? wsPane.scrollTop : 0
  lastWorkspaceTab = state.workspaceTab

  $('#wsTabs').innerHTML = tabBar(WORKSPACE_LABELS, state.workspaceTab, 'ws')
  wsPane.innerHTML =
    state.workspaceTab === 'note'
      ? renderNote()
      : state.workspaceTab === 'collect'
        ? renderCollect()
        : state.workspaceTab === 'tasks'
          ? renderTasks()
          : renderChannels()
  wsPane.scrollTop = prevScroll

  if (keepFocus) {
    const nextInput = document.getElementById(keepFocus.id)
    if (nextInput) {
      nextInput.focus({ preventScroll: true })
      if (keepFocus.start !== null && typeof nextInput.setSelectionRange === 'function') {
        try {
          nextInput.setSelectionRange(keepFocus.start, keepFocus.end)
        } catch (_) {}
      }
    }
  }
}

/* ── 右侧边栏四个面板 ── */
function renderChat() {
  const messages = state.chat
    .map((message) => {
      if (message.role === 'user') {
        return `<div class="msg msg-user"><div class="bubble">${esc(message.text)}</div>
          <div class="msg-meta"><span>${messageTime(message.at)}</span></div></div>`
      }
      if (message.role === 'system') {
        return `<div class="msg msg-system"><div class="bubble">${esc(message.text)}</div>
          <div class="msg-meta"><span>${messageTime(message.at)}</span></div></div>`
      }
      return `<div class="msg msg-agent">${traceBlock(message)}
        <div class="bubble">${esc(message.text)}</div>
        <div class="msg-meta"><span>${messageTime(message.at)}</span></div></div>`
    })
    .join('')
  const pending = pendingCard()
  const withPending = pending ? `${messages}<div class="msg msg-agent">${pending}</div>` : messages

  return `<div class="ctx-bar">
      <span class="ctx-note" title="${esc(state.note.path)}">${esc(state.note.path)}</span>
      <div class="ctx-actions">
        <button class="btn btn-ghost btn-xs" data-act="chat-action" data-chat="summarize">总结</button>
        <button class="btn btn-ghost btn-xs" data-act="organize">整理</button>
        <button class="btn btn-ghost btn-xs" data-act="chat-action" data-chat="ask">询问</button>
      </div>
    </div>
    <div class="messages">${withPending}</div>`
}

function renderHistory() {
  const filters = ['all', 'ark(plugin:tasks)', 'ark(ark-agent)', 'ark(astrbot)', 'plugin:collect']
  const chips = filters
    .map(
      (source) => `<button class="chip" data-act="history-filter" data-source="${esc(source)}"
        aria-pressed="${ui.historyFilter === source}">${source === 'all' ? '全部' : esc(source)}</button>`
    )
    .join('')
  const newest = [...state.snapshots].reverse().find((snapshot) => !snapshot.reverted)
  const rows = state.snapshots
    .filter((snapshot) => ui.historyFilter === 'all' || snapshot.source === ui.historyFilter)
    .slice()
    .reverse()
    .map((snapshot) => {
      const canUndo = newest && newest.commit === snapshot.commit && !snapshot.reverted
      return `<div class="tl-row ${snapshot.reverted ? 'reverted' : ''}">
        <span class="tl-dot"></span>
        <div class="tl-main">
          <div class="tl-top">
            <span class="badge ${SOURCE_CLASS(snapshot.source)}">${esc(snapshot.source)}</span>
            <span class="tl-summary">${esc(snapshot.message)}</span>
            <span class="tl-time">${messageTime(snapshot.at)}</span>
          </div>
          ${diffBlock(snapshot.diff)}
          <div class="tl-top">
            <span class="mono" style="font-size:10.5px;color:var(--faint)">${esc(snapshot.commit)}</span>
            <span class="badge ${snapshot.reverted ? 'undone' : ''}">${snapshot.reverted ? '已撤销' : '可撤销'}</span>
            <span class="spacer"></span>
            ${
              canUndo
                ? `<button class="btn btn-xs" data-act="undo" data-commit="${esc(snapshot.commit)}">一键撤销</button>`
                : snapshot.reverted
                  ? '<span style="font-size:10.5px;color:var(--faint)">这条已撤销，历史保留</span>'
                  : '<span style="font-size:10.5px;color:var(--faint)">被更新的快照盖住，需先撤新的</span>'
            }
          </div>
        </div>
      </div>`
    })
    .join('')
  return `<div class="filter-chips">${chips}</div>
    <div class="timeline">${
      rows ||
      '<div class="empty"><strong>还没有快照</strong><span>整理笔记、完成任务或采集入库都会各落一条。</span></div>'
    }</div>`
}

function renderMemory() {
  const inferred = state.memories.filter((memory) => memory.status === 'inferred')
  const confirmed = state.memories.filter((memory) => memory.status === 'confirmed')
  const resident = residentPreview(state)
  const downgradeHosts = [...new Set(confirmed.map((memory) => memory.via))]

  const memCard = (memory) => {
    const isInferred = memory.status === 'inferred'
    return `<div class="mem ${memory.status}">
      <div class="mem-accent"></div>
      <div class="mem-inner">
        <div class="mem-top">
          <span class="pill ${isInferred ? 'inf' : 'conf'}">${isInferred ? 'inferred' : 'confirmed'}</span>
          <span>${esc(memory.kind)} · ${esc(memory.at)}</span>
          <span class="spacer"></span>
          <span class="mono" style="font-size:10px">via ${esc(memory.via)}</span>
        </div>
        <div class="mem-text ${isInferred ? 'mem-inferred-text' : ''}">${esc(memoryDisplay(memory))}</div>
        <div class="mem-quote">${esc(memory.quote)}</div>
        <div class="mem-actions">
          ${
            isInferred
              ? `<button class="btn btn-primary btn-xs" data-act="confirm-memory" data-id="${memory.id}">确认升入常驻层</button>
                 <span style="font-size:10.5px;color:var(--faint)">不计入 2k 常驻预览</span>`
              : `<button class="btn btn-xs" data-act="downgrade" data-host="${memory.via}">按 via=${esc(memory.via)} 一键降级</button>`
          }
        </div>
      </div>
    </div>`
  }

  return `<div class="downgrade-row">
      <span>按通道批量降级：</span>
      ${
        downgradeHosts.length
          ? downgradeHosts
              .map(
                (host) =>
                  `<button class="btn btn-xs" data-act="downgrade" data-host="${host}">${esc(host)}</button>`
              )
              .join('')
          : '<span style="color:var(--faint)">当前没有已确认条目</span>'
      }
      <span class="spacer"></span>
      <span>常驻层 <span class="num">${resident.tokens}</span> / <span class="num">${resident.limit}</span> tok</span>
    </div>
    <div class="mem-group">
      <h4>推断 · ${inferred.length} 条（不进常驻层）</h4>
      ${inferred.map(memCard).join('') || '<div class="empty" style="padding:16px">没有待确认的推断条目</div>'}
    </div>
    <div class="mem-group" style="padding-bottom:22px">
      <h4>已确认 · ${confirmed.length} 条（计入 2k 常驻层）</h4>
      ${confirmed.map(memCard).join('') || '<div class="empty" style="padding:16px">常驻层还没有条目</div>'}
    </div>`
}

function renderSettings() {
  const resident = residentPreview(state)
  const onDemandUsed = Math.min(
    ARK_BUDGET.onDemand,
    resident.parts.reduce((sum, part) => sum + part.tokens, 0) + 320
  )
  const onDemandPct = Math.round((onDemandUsed / ARK_BUDGET.onDemand) * 100)
  const swatches = ['var(--accent)', '#4f93d6', 'var(--ok)']
  const legend = resident.parts
    .map(
      (part, index) =>
        `<span><i class="swatch" style="background:${swatches[index]}"></i>${esc(part.label)} ${part.tokens}</span>`
    )
    .join('')
  const segments = resident.parts
    .map(
      (part) =>
        `<i style="width:${Math.max(2, Math.round((part.tokens / resident.limit) * 100))}%"></i>`
    )
    .join('')

  return `<div class="settings">
    <div class="card">
      <div class="kv"><h4 style="margin:0;font-size:12px">ark serve</h4><span class="badge host">运行中</span>
        <span class="spacer"></span><span class="num" style="font-size:10.5px">pid 7852</span></div>
      <div class="kv"><span class="mono" style="font-size:11.5px">http://127.0.0.1:8650</span></div>
      <div class="kv"><span>单进程同时暴露两个协议面</span></div>
      <div class="kv"><span class="mono" style="font-size:11px">/mcp</span><span>MCP Streamable HTTP：Core 工具 + 插件工具</span></div>
      <div class="kv"><span class="mono" style="font-size:11px">/v1</span><span>OpenAI 兼容 SSE + 动作确认 + 插件界面接口</span></div>
    </div>
    <div class="card">
      <h4>上下文预算 · 两层</h4>
      <div class="budget">
        <div class="kv"><span>常驻层（会话开始装配）</span><span class="spacer"></span>
          <span class="num">${resident.tokens} / ${resident.limit} tok</span></div>
        <div class="bar" role="img" aria-label="常驻层已用">${segments}</div>
        <div class="bar-legend">${legend}</div>
      </div>
      <div class="budget">
        <div class="kv"><span>按需层（recall / search）</span><span class="spacer"></span>
          <span class="num">${onDemandUsed} / ${ARK_BUDGET.onDemand} tok</span></div>
        <div class="bar" role="img" aria-label="按需层已用，约 ${onDemandPct}%">
          <i style="width:${Math.round(onDemandPct * 0.5)}%"></i><i style="width:${Math.round(onDemandPct * 0.5)}%"></i>
        </div>
        <div class="bar-legend"><span>记忆与笔记各占一半，用不满的让给另一边</span></div>
      </div>
      <p class="ssub">推断条目永远不进常驻层 —— 不是「预算还有空就塞进去」，而是结构上就不在候选里。</p>
    </div>
    <div class="card">
      <div class="kv"><span>快照</span><span class="spacer"></span>
        <span class="num">${state.snapshots.length}</span><span style="color:var(--faint)">条</span></div>
      <div class="kv"><span>其中已撤销</span><span class="spacer"></span>
        <span class="num">${state.snapshots.filter((s) => s.reverted).length}</span></div>
      <div class="kv"><span>AgentMail 已发出</span><span class="spacer"></span>
        <span class="num">${state.mail.sentCount}</span><span style="color:var(--faint)">封</span></div>
      <div class="kv"><span>待确认外部动作</span><span class="spacer"></span>
        <span class="num">${state.pendingAction && state.pendingAction.status === 'pending' ? 1 : 0}</span></div>
      <div class="kv"><span>待合并的过期写入</span><span class="spacer"></span>
        <span class="num">${state.thread.pendingConflicts.length}</span></div>
    </div>
    <div class="card">
      <h4>观测</h4>
      <div class="kv"><span>[core] trace</span><span class="spacer"></span><span class="mono">summary</span></div>
      <div class="kv"><span>轨迹落盘</span><span class="spacer"></span><span class="mono" style="font-size:11px">.ark/traces/&lt;日期&gt;/&lt;turn_id&gt;.json</span></div>
      <div class="kv"><span>门禁</span><span class="spacer"></span><span class="mono" style="font-size:11px">evals/gate.py</span></div>
    </div>
  </div>`
}

function renderSidebar() {
  $('#sideTabs').innerHTML = tabBar(SIDEBAR_LABELS, state.sidebarTab, 'side')
  $('#sidePane').innerHTML =
    state.sidebarTab === 'chat'
      ? renderChat()
      : state.sidebarTab === 'history'
        ? renderHistory()
        : state.sidebarTab === 'memory'
          ? renderMemory()
          : renderSettings()
}

function renderScenarioBar() {
  $('#scenarioBar').innerHTML = ARK_SCENARIO_META.map(
    (meta) => `<button class="scenario" data-act="scenario" data-id="${meta.id}" data-scenario="${meta.id}"
      aria-pressed="${state.scenario === meta.id}" title="${esc(meta.summary)}">
      <span class="scenario-head"><strong>${esc(meta.label)}</strong><em class="scenario-steps">${meta.steps} 步</em></span>
      <span class="scenario-desc">${esc(meta.summary)}</span></button>`
  ).join('')
}

function renderZoneBar() {
  const hasPending = Boolean(state.pendingAction && state.pendingAction.status === 'pending')
  const pendingBadge = hasPending
    ? ' <span class="zone-alert"><span class="dot warn"></span>待确认</span>'
    : ''
  $('#zoneBar').innerHTML = `
    <button class="zone-btn" data-act="zone" data-zone="workspace" aria-pressed="${ui.zone === 'workspace'}">
      <span>主工作区</span><span class="zone-sub">（笔记 / 采集 / 看板 / 渠道）</span>
    </button>
    <button class="zone-btn" data-act="zone" data-zone="sidebar" aria-pressed="${ui.zone === 'sidebar'}">
      <span>Ark 边栏${pendingBadge}</span><span class="zone-sub">（对话 / 历史 / 记忆 / 设置）</span>
    </button>`
}

function render() {
  document.documentElement.dataset.theme = ui.theme
  const appEl = $('.app')
  if (appEl) appEl.dataset.zone = ui.zone
  renderScenarioBar()
  renderZoneBar()
  renderWorkspace()
  renderSidebar()
}

/* ── 事件：全部走 dispatch ── */
function apply(action, note) {
  const before = new Set(state.collectItems.map((item) => item.id))
  const next = dispatch(state, action)
  const changed = next !== state
  state = next
  // A freshly submitted link lands selected and unfiltered, so the very next
  // click is the one that advances it — that keeps each scenario inside six
  // clicks. Detected by id, not by action type: a channel card reaches dispatch
  // through `run-channel-action`, which forwards to `collect-submit`.
  const fresh = state.collectItems.find((item) => !before.has(item.id))
  if (fresh) {
    ui.selected = fresh.id
    ui.status = 'all'
    ui.category = 'all'
    ui.detailOpen = true
  }
  render()
  if (changed && note) toast(note)
  return changed
}

const ACTIONS = {
  zone: (el) => {
    ui.zone = el.dataset.zone
    render()
  },
  'ws-tab': (el) => {
    ui.zone = 'workspace'
    apply({ type: 'set-workspace-tab', tab: el.dataset.tab })
  },
  'side-tab': (el) => {
    ui.zone = 'sidebar'
    apply({ type: 'set-sidebar-tab', tab: el.dataset.tab })
  },
  theme: () => {
    ui.theme = ui.theme === 'dark' ? 'light' : 'dark'
    persistTheme()
    applyTheme()
    render()
  },
  reset: () => {
    state = dispatch(state, { type: 'reset' })
    ui = createUiState(ui.theme)
    render()
    toast('已回到初始预设状态')
  },
  scenario: (el) => {
    state = dispatch(state, { type: 'run-scenario', scenario: el.dataset.id })
    ui.status = 'all'
    ui.category = 'all'
    ui.detailOpen = true
    ui.selected = state.collectItems.length
      ? state.collectItems[state.collectItems.length - 1].id
      : ''
    ui.zone = el.dataset.id === 'vault-write-and-undo' ? 'sidebar' : 'workspace'
    render()
    toast(`剧本已载入：${el.querySelector('strong').textContent}`)
  },
  organize: () => apply({ type: 'organize-note' }, '已写入 1 个快照 —— 写入前不需要确认'),
  'undo-latest': () => apply({ type: 'undo-latest' }, '已撤销上一条快照'),
  undo: (el) => apply({ type: 'undo-snapshot', commit: el.dataset.commit }, '原文已精确复原'),
  'collect-view': (el) => {
    ui.view = el.dataset.view
    render()
  },
  'collect-status': (el) => {
    ui.status = el.dataset.status
    ui.category = 'all'
    render()
  },
  'collect-category': (el) => {
    ui.category = el.dataset.category
    ui.status = 'all'
    render()
  },
  'collect-select': (el) => {
    ui.selected = el.dataset.id
    ui.detailOpen = true
    render()
  },
  'collect-close': () => {
    ui.detailOpen = false
    render()
  },
  'collect-finish': (el) =>
    apply({ type: 'collect-finish', id: el.dataset.id }, '已入库：摘要笔记落在 Vault 里'),
  'collect-retry': (el) => apply({ type: 'collect-retry', id: el.dataset.id }, '重试任务已入队'),
  'task-move': (el) =>
    apply(
      { type: 'move-task', id: el.dataset.id, status: el.dataset.status },
      '看板与 context.md 已更新，并记录 ark(plugin:tasks) 快照'
    ),
  'board-tag': (el) => {
    const next = el.dataset.tag
    ui.boardTag = ui.boardTag === next && next !== 'all' ? 'all' : next
    render()
  },
  'task-quick-toggle': () => {
    ui.quickAddOpen = !ui.quickAddOpen
    render()
    if (ui.quickAddOpen) {
      const input = $('#quickTaskTitle')
      if (input) {
        input.focus()
        input.select()
      }
    }
  },
  'quick-tag-toggle': (el) => {
    const tag = el.dataset.tag
    if (ui.quickAddTags.includes(tag)) {
      if (ui.quickAddTags.length > 1) ui.quickAddTags = ui.quickAddTags.filter((item) => item !== tag)
    } else {
      ui.quickAddTags = [...ui.quickAddTags, tag]
    }
    render()
  },
  'quick-due-toggle': () => {
    ui.quickAddDueToday = !ui.quickAddDueToday
    render()
  },
  'tasks-jump-wb': () => {
    ui.wbOpen = true
    if (ui.wbView === 'week') ui.wbView = 'year'
    render()
    const wb = $('#tasksWorkbench')
    if (wb) wb.scrollIntoView({ behavior: 'smooth', block: 'start' })
  },
  'wb-toggle': () => {
    ui.wbOpen = !ui.wbOpen
    render()
  },
  'wb-tab': (el) => {
    ui.wbOpen = true
    ui.wbView = el.dataset.view
    render()
  },
  'wb-tag': (el) => {
    const next = el.dataset.tag
    ui.wbTag = ui.wbTag === next && next !== 'all' ? 'all' : next
    render()
  },
  'wb-pivot-tag': (el) => {
    const next = el.dataset.tag
    ui.wbTag = ui.wbTag === next ? 'all' : next
    render()
    toast(ui.wbTag === 'all' ? '已返回全部标签分布' : `回顾筛选切到「${ui.wbTag}」· 显示其共现标签构成`)
  },
  'wb-clear-filter': () => {
    ui.wbTag = 'all'
    ui.wbQuery = ''
    render()
  },
  'wb-month-prev': () => {
    const d = new Date(Date.UTC(ui.wbYear, ui.wbMonth - 1, 1))
    ui.wbYear = d.getUTCFullYear()
    ui.wbMonth = d.getUTCMonth()
    render()
  },
  'wb-month-next': () => {
    const d = new Date(Date.UTC(ui.wbYear, ui.wbMonth + 1, 1))
    ui.wbYear = d.getUTCFullYear()
    ui.wbMonth = d.getUTCMonth()
    render()
  },
  'wb-month-now': () => {
    ui.wbYear = 2026
    ui.wbMonth = 10
    render()
  },
  'wb-pick-month': (el) => {
    ui.wbYear = 2026
    ui.wbMonth = Number(el.dataset.month)
    ui.wbView = 'month'
    render()
  },
  'task-gen-review': (el) => {
    const period = el.dataset.period
    const monthKey = `${ui.wbYear}-${String(ui.wbMonth + 1).padStart(2, '0')}`
    const fileLabel =
      period === 'week'
        ? '周报 Ark 工作区/tasks/reviews/2026-W47.md'
        : period === 'month'
          ? `月报 Ark 工作区/tasks/reviews/${monthKey}.md`
          : '年报 Ark 工作区/tasks/reviews/2026.md'
    const changed = apply(
      {
        type: 'generate-task-review',
        period,
        tag: ui.wbTag,
        query: ui.wbQuery,
        month: monthKey
      },
      `已生成${fileLabel}（已记入快照，可撤销）`
    )
    if (!changed) toast(`${fileLabel} 与当前筛选下的内容一致`)
    const latest = state.taskReviews[state.taskReviews.length - 1]
    if (latest) {
      ui.previewReviewPath = latest.path
      render()
    }
  },
  'wb-preview-review': (el) => {
    const path = el.dataset.path
    ui.previewReviewPath = ui.previewReviewPath === path ? null : path
    render()
  },
  'channel-action': (el) => {
    const channelAct = el.dataset.channelAction
    if (
      channelAct === 'inspect-history' ||
      channelAct === 'list-tasks' ||
      channelAct === 'resume-thread' ||
      channelAct === 'recall-memory'
    ) {
      ui.zone = 'sidebar'
    } else if (channelAct === 'collect-submit' || channelAct === 'organize-note') {
      ui.zone = 'workspace'
    }
    apply({
      type: 'run-channel-action',
      host: el.dataset.host,
      action: channelAct
    })
  },
  decide: (el) =>
    apply(
      { type: 'resolve-pending-action', decision: el.dataset.decision },
      el.dataset.decision === 'approve' ? '已批准：邮件发出' : '已拒绝：没有任何外部副作用'
    ),
  'confirm-memory': (el) =>
    apply({ type: 'confirm-memory', id: el.dataset.id }, '记忆已确认，进入 2k 常驻层'),
  downgrade: (el) =>
    apply({ type: 'downgrade-by-channel', host: el.dataset.host }, `已按通道 ${el.dataset.host} 降级`),
  'save-thread': (el) => {
    const stale = el.dataset.base === 'stale'
    apply(
      {
        type: 'save-thread',
        host: el.dataset.host,
        baseRev: stale ? STALE_BASE_REV : CURRENT_REV,
        summary: stale
          ? '终端这边的结论：只做两栏就够。'
          : '桌面端接上：先把 note 与 collect 两栏做实，再谈渠道。'
      },
      stale ? 'base_rev 已过期，这次保存进入 .pending 待合并' : 'Live State 已推进到新 rev'
    )
  },
  'history-filter': (el) => {
    ui.historyFilter = el.dataset.source
    render()
  },
  'chat-action': (el) => {
    const kind = el.dataset.chat
    apply(
      {
        type: 'run-channel-action',
        host: 'obsidian',
        action: kind === 'summarize' ? 'recall-memory' : 'list-tasks'
      },
      kind === 'summarize' ? '已按当前笔记召回记忆' : '已查一次任务'
    )
  }
}

document.addEventListener('click', (event) => {
  const trigger = event.target.closest('[data-act]')
  if (!trigger) return
  const handler = ACTIONS[trigger.dataset.act]
  if (handler) handler(trigger)
})

let composingInput = false
function handleLiveInput(target) {
  if (!target || !target.dataset || !target.dataset.input) return
  const kind = target.dataset.input
  if (kind === 'board-query') {
    ui.boardQuery = target.value
    renderWorkspace()
  } else if (kind === 'wb-query') {
    ui.wbQuery = target.value
    renderWorkspace()
  } else if (kind === 'quick-title') {
    ui.quickAddTitle = target.value
  }
}

document.addEventListener('compositionstart', () => {
  composingInput = true
})
document.addEventListener('compositionend', (event) => {
  composingInput = false
  handleLiveInput(event.target)
})
document.addEventListener('input', (event) => {
  if (composingInput || event.isComposing) return
  handleLiveInput(event.target)
})

document.addEventListener('submit', (event) => {
  if (event.target.id === 'taskQuickForm') {
    event.preventDefault()
    const title = (ui.quickAddTitle || '').trim()
    if (!title) {
      toast('请先输入任务标题')
      return
    }
    const created = apply(
      {
        type: 'create-task',
        title,
        tags: ui.quickAddTags,
        dueToday: ui.quickAddDueToday
      },
      '新任务已写入看板，并记录 ark(plugin:tasks) 快照'
    )
    if (created) {
      ui.quickAddOpen = false
      ui.quickAddTitle = ''
      ui.boardTag = 'all'
      ui.boardQuery = ''
      render()
    }
    return
  }
  if (event.target.id !== 'captureForm') return
  event.preventDefault()
  const input = $('#captureUrl')
  const url = input.value.trim()
  if (!url) return
  try {
    const parsed = new URL(url)
    if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('只接受 http 或 https 链接')
  } catch (error) {
    toast(error.message || '链接格式不对')
    return
  }
  const before = state.collectItems.length
  apply({ type: 'collect-submit', url, host: 'obsidian' })
  if (state.collectItems.length > before) {
    input.value = ''
    $('#captureUrl') && $('#captureUrl').focus()
    toast('已进采集队列 —— 点详情里的「完成入库」推进这一步')
  }
})

ui.theme = readTheme()
applyTheme()
render()
</script>
</body>
</html>
